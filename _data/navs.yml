# 星星导航 —— 站点数据
# 加站点：在对应分组 items 下照格式追加一行即可
#   icon  ：图标图片（assets/img/navs/ 下），有图优先用图
#   emoji ：没有图片时用的表情
#   mark  ：兜底文字标（图片加载失败 / emoji 不显示时自动顶上）
# 注意：能走 https 的站优先写 https（canvas / 宿舍购电 / AI 平台 / 超星 已校验证书可用）；
#       校内其余站点只支持 http，浏览器会提示不安全，属正常

