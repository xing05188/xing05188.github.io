# ---------- 文章链接格式 ----------
permalink: /posts/:title/

# ---------- Markdown 渲染 ----------
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  toc_levels: 2..3
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# ---------- 插件（均在 GitHub Pages 支持列表内） ----------
plugins:
  - jemoji

# ---------- 默认值 ----------
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true

# ---------- 构建排除 ----------
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .codebuddy
  - .gitignore
  - scripts

# ---------- 首页文章展示上限 ----------
home_posts_limit: 20
