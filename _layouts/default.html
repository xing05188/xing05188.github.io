<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  {% include head.html %}
</head>
<body>

  <a class="skip-link" href="#main" style="position:absolute;left:-9999px">跳到主要内容</a>

  {% include header.html %}

  <main id="main">
    {{ content }}
  </main>

  {% include footer.html %}

  <script src="{{ '/assets/js/posts-data.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/pinyin-data.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>

  <!-- Service Worker（PWA 离线支持） -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('{{ '/sw.js' | relative_url }}').catch(function () {});
      });
    }
  </script>
</body>
</html>
