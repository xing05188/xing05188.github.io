---
layout: default
---

<div class="wrap">
  <div class="measure">
    {% if page.title %}
    <div class="page-head">
      <h1>{{ page.title }}</h1>
      {% if page.description %}<p>{{ page.description }}</p>{% endif %}
    </div>
    {% endif %}

    <div class="page-body" style="padding:38px 0 76px">
      {{ content }}
    </div>
  </div>
</div>
