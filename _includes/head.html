<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>{% if page.title and page.layout != 'home' %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · {{ site.tagline }}{% endif %}</title>
<meta name="description" content="{% if page.description %}{{ page.description }}{% elsif page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 150 }}{% else %}{{ site.description }}{% endif %}">

<meta name="author" content="{{ site.author }}">
<meta name="generator" content="Jekyll">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<!-- Open Graph / Twitter -->
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{% if page.title and page.layout != 'home' %}{{ page.title }}{% else %}{{ site.title }} · {{ site.tagline }}{% endif %}">
<meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:locale" content="zh_CN">
<meta property="og:image" content="{% if page.og_image %}{{ page.og_image | absolute_url }}{% else %}{{ '/assets/img/og-default.png' | absolute_url }}{% endif %}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{% if page.og_image %}{{ page.og_image | absolute_url }}{% else %}{{ '/assets/img/og-default.png' | absolute_url }}{% endif %}">
{% if page.layout == 'post' %}
<meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
{% if page.updated %}<meta property="article:modified_time" content="{{ page.updated | date_to_xmlschema }}">{% endif %}
{% for t in page.tags %}<meta property="article:tag" content="{{ t }}">
{% endfor %}
{% endif %}

<!-- 主题色（跟随系统的亮暗偏好） -->
<meta name="theme-color" content="#fbfaf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171a" media="(prefers-color-scheme: dark)">

<!-- 图标：一颗星 -->
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/img/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">

<!-- 字体：衬线展示字 Noto Serif SC（loli 镜像，国内可用；加载失败时回退系统衬线） -->
<link rel="preconnect" href="https://fonts.loli.net" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@400;600;700;900&display=swap">

<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
<link rel="sitemap" type="application/xml" href="{{ '/sitemap.xml' | relative_url }}">

<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/syntax.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/pet.css' | relative_url }}">

<!-- 结构化数据（SEO） -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": {{ site.title | jsonify }},
  "url": "{{ site.url }}{{ site.baseurl }}/",
  "description": {{ site.description | jsonify }},
  "inLanguage": "zh-CN",
  "author": { "@type": "Person", "name": {{ site.author | jsonify }} },
  "potentialAction": {
    "@type": "SearchAction",
    "target": "{{ site.url }}{{ site.baseurl }}/search/?q={search_term_string}",
    "query-input": "required name=search_term_string"
  }
}
</script>
{% if page.layout == 'post' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ page.title | jsonify }},
  "description": {{ page.description | default: page.excerpt | strip_html | strip_newlines | truncate: 150 | jsonify }},
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.updated | default: page.date | date_to_xmlschema }}",
  "inLanguage": "zh-CN",
  "author": { "@type": "Person", "name": {{ site.author | jsonify }} },
  "publisher": { "@type": "Person", "name": {{ site.author | jsonify }} },
  "mainEntityOfPage": "{{ page.url | absolute_url }}",
  "url": "{{ page.url | absolute_url }}",
  "keywords": {{ page.tags | join: ", " | jsonify }}
}
</script>
{% endif %}

<!-- 主题预设：三态（亮 / 暗 / 跟随系统），渲染前定好，避免闪白 -->
<script>
(function () {
  try {
    var mode = localStorage.getItem('theme') || 'auto';
    var dark = mode === 'dark' ||
      (mode === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var root = document.documentElement;
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
    root.setAttribute('data-mode', mode);
  } catch (e) {}
})();
</script>

<!-- 主页特效预备态：JS 已启用但尚未初始化时先藏首屏标题（main.js 就绪后逐字入场；无 JS 时不受影响） -->
<script>document.documentElement.setAttribute('data-js', 'pre');</script>
