---
layout: default
title: PDF 阅读器
description: 选择本地 PDF，在浏览器里直接阅读，文件不会上传到服务器。
permalink: /lab/pdf-viewer.html
---

<div class="pdf-tool">
  <div class="wrap">
    <div class="page-head">
      <h1>PDF 阅读器</h1>
      <p class="page-desc">选择本地的 PDF 文件即可在浏览器里直接阅读。文件<strong>只在你的设备上处理，不会上传到任何服务器</strong>。</p>
    </div>
  </div>

  <div class="wrap">
    <!-- 上传 / 拖拽区 -->
    <div class="pdf-drop" id="drop" role="button" tabindex="0" aria-label="选择或拖入 PDF 文件">
      <input type="file" id="file" accept="application/pdf,.pdf" hidden>
      <div class="pdf-drop-icon" aria-hidden="true">▤</div>
      <p class="pdf-drop-title">把 PDF 拖到这里，或 <button type="button" class="pdf-link" id="pick">点击选择文件</button></p>
      <p class="pdf-drop-hint" id="hint">支持单个 .pdf 文件</p>
    </div>

    <!-- 阅读区 -->
    <div class="pdf-reader" id="reader" hidden>
      <div class="pdf-bar">
        <span class="pdf-name" id="name">文件名</span>
        <div class="pdf-bar-actions">
          <a class="pdf-dl" id="dl" download>下载</a>
          <button type="button" class="pdf-close" id="close">关闭</button>
        </div>
      </div>
      <embed id="view" type="application/pdf" class="pdf-embed">
      <p class="pdf-fallback" id="fallback" hidden>当前浏览器可能无法内嵌预览 PDF，请使用上方「下载」按钮保存到本地后打开。</p>
    </div>

    <p class="pdf-foot">提示：阅读进度由浏览器自身记录，关闭页面后不会留存任何数据。</p>
  </div>
</div>

<script>
(function () {
  var drop = document.getElementById('drop');
  var fileInput = document.getElementById('file');
  var pick = document.getElementById('pick');
  var hint = document.getElementById('hint');
  var reader = document.getElementById('reader');
  var view = document.getElementById('view');
  var nameEl = document.getElementById('name');
  var dl = document.getElementById('dl');
  var closeBtn = document.getElementById('close');
  var fallback = document.getElementById('fallback');
  var currentUrl = null;

  function isPdf(file) {
    return file && (file.type === 'application/pdf' || /\.pdf$/i.test(file.name));
  }

  function openFile(file) {
    if (!file) return;
    if (!isPdf(file)) {
      hint.textContent = '⚠ 请选择 PDF 文件（.pdf）';
      hint.classList.add('err');
      return;
    }
    hint.classList.remove('err');

    if (currentUrl) URL.revokeObjectURL(currentUrl);
    var url = URL.createObjectURL(file);
    currentUrl = url;

    view.src = url;
    nameEl.textContent = file.name;
    dl.href = url;
    dl.setAttribute('download', file.name);

    reader.hidden = false;
    drop.hidden = true;
    fallback.hidden = true;
    reader.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  pick.addEventListener('click', function (e) {
    e.preventDefault();
    fileInput.click();
  });

  drop.addEventListener('click', function (e) {
    if (e.target === pick) return;
    fileInput.click();
  });

  drop.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
  });

  fileInput.addEventListener('change', function () {
    if (fileInput.files && fileInput.files[0]) openFile(fileInput.files[0]);
  });

  ['dragenter', 'dragover'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); });
  });
  drop.addEventListener('dragleave', function () { drop.classList.remove('over'); });
  drop.addEventListener('drop', function (e) {
    e.preventDefault();
    drop.classList.remove('over');
    var dt = e.dataTransfer;
    if (dt && dt.files && dt.files[0]) openFile(dt.files[0]);
  });

  closeBtn.addEventListener('click', function () {
    if (currentUrl) { URL.revokeObjectURL(currentUrl); currentUrl = null; }
    view.src = '';
    reader.hidden = true;
    drop.hidden = false;
    fileInput.value = '';
    hint.textContent = '支持单个 .pdf 文件';
  });

  // 部分浏览器内嵌 PDF 会触发 embed 的 error 事件
  view.addEventListener('error', function () { fallback.hidden = false; });
})();
</script>

<style>
  .pdf-tool .page-head { padding: 46px 0 8px; }
  .pdf-tool .page-desc { font-size: 1rem; color: var(--text-soft); max-width: 720px; }
  .pdf-tool .page-desc strong { color: var(--accent); font-weight: 600; }

  /* 拖拽区 */
  .pdf-drop {
    margin: 22px 0 14px;
    padding: 54px 24px;
    text-align: center;
    border: 1.5px dashed var(--border);
    border-radius: var(--radius);
    background: var(--bg-elev);
    color: var(--text-soft);
    cursor: pointer;
    transition: border-color .2s var(--ease), background-color .2s var(--ease), transform .2s var(--ease);
  }
  .pdf-drop:hover, .pdf-drop.over {
    border-color: var(--accent);
    background: var(--accent-soft);
    transform: translateY(-1px);
  }
  .pdf-drop:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .pdf-drop-icon {
    font-size: 2.4rem; color: var(--accent); line-height: 1;
    margin-bottom: 12px; opacity: .85;
  }
  .pdf-drop-title { font-size: 1.05rem; margin: 0 0 6px; color: var(--text); }
  .pdf-drop-hint { font-size: .85rem; margin: 0; color: var(--text-mute); }
  .pdf-drop-hint.err { color: #c0392b; }

  .pdf-link {
    font: inherit; color: var(--accent); cursor: pointer;
    background: none; border: none; padding: 0; text-decoration: underline;
    text-underline-offset: 3px;
  }
  .pdf-link:hover { color: var(--accent-hover); }

  /* 阅读区 */
  .pdf-reader {
    margin: 22px 0 8px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg-elev);
    overflow: hidden;
    box-shadow: var(--shadow-md);
  }
  .pdf-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-soft);
  }
  .pdf-name {
    font-size: .92rem; color: var(--text); font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pdf-bar-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .pdf-dl, .pdf-close {
    font-size: .85rem; padding: 6px 14px; border-radius: 999px; cursor: pointer;
    text-decoration: none; border: 1px solid var(--border); background: var(--bg-elev);
    color: var(--text-soft); transition: all .18s var(--ease);
  }
  .pdf-dl:hover, .pdf-close:hover { border-color: var(--accent); color: var(--accent); }
  .pdf-embed {
    display: block; width: 100%; height: 82vh; min-height: 460px;
    border: 0; background: var(--bg-soft);
  }
  .pdf-fallback {
    margin: 0; padding: 14px 18px; font-size: .85rem; color: var(--text-mute);
    border-top: 1px solid var(--border); background: var(--bg-soft);
  }
  .pdf-foot { font-size: .82rem; color: var(--text-mute); margin: 14px 2px 64px; }

  @media (max-width: 640px) {
    .pdf-embed { height: 70vh; }
    .pdf-bar { flex-wrap: wrap; }
  }
</style>
