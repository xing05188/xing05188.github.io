<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>文韵山河·洪州道韵 —— 南昌“一人得道”的千年文脉</title>
<style>
  :root{
    --ink:#1b1f22; --paper:#f3ece0; --gold:#b08d57; --red:#a63a32; --line:rgba(176,141,87,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b0d10;overflow:hidden;
    font-family:"Noto Serif CJK SC","Source Han Serif SC","Songti SC","STSong",serif;
    -webkit-font-smoothing:antialiased;color:#e9e2d5}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 120% at 50% 40%,#16191d 0%,#0a0c0e 70%)}
  #stage{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;overflow:hidden;
    background:#f3ece0;box-shadow:0 30px 90px rgba(0,0,0,.75),0 0 0 1px rgba(176,141,87,.18);
    font-size:calc(min(100vw,177.78vh)/100)}
  canvas#film{display:block;width:100%;height:100%}

  /* ---------- 顶部信息 ---------- */
  #top{position:absolute;left:3em;top:2.4em;right:3em;display:flex;justify-content:space-between;
    align-items:flex-start;pointer-events:none;opacity:.0;transition:opacity .6s;font-size:.95em;
    letter-spacing:.22em;color:#3a4046;mix-blend-mode:multiply}
  #stage.ui #top{opacity:.75}
  #topL{display:flex;align-items:center;gap:.9em}
  #topL .dot{width:.45em;height:.45em;background:var(--red);border-radius:50%;box-shadow:0 0 0 .18em rgba(166,58,50,.18)}
  #topR{font-variant-numeric:tabular-nums;letter-spacing:.16em}

  /* ---------- 播放条 ---------- */
  #bottom{position:absolute;left:0;right:0;bottom:0;padding:0 2.4em 1.4em;
    background:linear-gradient(to top,rgba(10,12,14,.82),rgba(10,12,14,0));
    opacity:0;transition:opacity .35s;pointer-events:none}
  #stage.ui #bottom,#stage:hover #bottom{opacity:1;pointer-events:auto}
  #track{position:relative;height:1.5em;cursor:pointer;margin-bottom:.6em}
  #track .bg{position:absolute;left:0;right:0;top:.62em;height:.18em;background:rgba(255,255,255,.16);border-radius:1em}
  #track .done{position:absolute;left:0;top:.62em;height:.18em;background:linear-gradient(90deg,#c9a86a,#e8d3a8);border-radius:1em;width:0}
  #track .marks{position:absolute;inset:0}
  #track .mark{position:absolute;top:.42em;width:1px;height:.6em;background:rgba(255,255,255,.28)}
  #track .mark span{position:absolute;left:.5em;top:-1.5em;font-size:.72em;letter-spacing:.2em;color:rgba(233,226,213,.55);white-space:nowrap}
  #rows{display:flex;align-items:center;gap:1.1em;color:#e9e2d5;font-size:.86em;letter-spacing:.12em}
  .btn{display:inline-flex;align-items:center;gap:.4em;padding:.42em .8em;border:1px solid rgba(176,141,87,.32);
    border-radius:.25em;background:rgba(255,255,255,.04);cursor:pointer;user-select:none;transition:.2s;white-space:nowrap}
  .btn:hover{background:rgba(176,141,87,.18);border-color:rgba(176,141,87,.7)}
  .btn.on{background:rgba(176,141,87,.28);border-color:rgba(176,141,87,.85);color:#fff4dd}
  #rows .sp{flex:1}
  #tc{font-variant-numeric:tabular-nums;opacity:.7;letter-spacing:.18em}

  /* ---------- 开场 ---------- */
  #intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:1.6em;background:radial-gradient(72% 72% at 50% 46%,rgba(12,14,16,.62),rgba(6,8,10,.93) 78%),linear-gradient(rgba(8,10,12,.35),rgba(8,10,12,.55));
    backdrop-filter:blur(2px);transition:opacity .9s;z-index:9}
  #intro.hide{opacity:0;pointer-events:none}
  #intro .t1{font-size:5.2em;letter-spacing:.3em;color:#f6efe2;text-shadow:0 0 2em rgba(200,170,110,.35);font-weight:500}
  #intro .t2{font-size:1.3em;letter-spacing:.44em;color:rgba(240,232,214,.86);text-shadow:0 0 .8em rgba(201,168,106,.35)}
  #intro .rule{width:22em;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.8}
  #intro .t3{font-size:.95em;letter-spacing:.3em;color:rgba(233,226,213,.6)}
  #play{margin-top:1em;padding:.85em 3.2em;border:1px solid rgba(201,168,106,.65);border-radius:.2em;
    font-size:1.15em;letter-spacing:.5em;color:#f6e9cd;cursor:pointer;background:rgba(201,168,106,.08);transition:.3s}
  #play:hover{background:rgba(201,168,106,.22);box-shadow:0 0 2.5em rgba(201,168,106,.35)}
  #hintline{position:absolute;bottom:3em;left:0;right:0;text-align:center;font-size:.82em;letter-spacing:.22em;color:rgba(233,226,213,.42)}
  body.clean #top,body.clean #bottom{display:none}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="film" width="1920" height="1080"></canvas>

    <div id="top">
      <div id="topL"><i class="dot"></i><span id="chapLabel">片头</span></div>
      <div id="topR">文韵山河 · 洪州道韵</div>
    </div>

    <div id="bottom">
      <div id="track">
        <div class="bg"></div><div class="done" id="done"></div>
        <div class="marks" id="marks"></div>
      </div>
      <div id="rows">
        <div class="btn" id="bPlay">▶ 播放</div>
        <div class="btn" id="bBack">⟲ 重播</div>
        <div class="btn" id="c1">一章</div>
        <div class="btn" id="c2">二章</div>
        <div class="btn" id="c3">三章</div>
        <div class="sp"></div>
        <div class="btn on" id="bSub">字幕</div>
        <div class="btn on" id="bVoice">配音</div>
        <div class="btn" id="bVoicePick" title="切换配音音色">音色</div>
        <div class="btn on" id="bSnd">古乐</div>
        <div class="btn" id="bFull">全屏</div>
        <div id="tc">00:00 / 05:10</div>
      </div>
    </div>

    <div id="intro">
      <div class="t1">文韵山河</div>
      <div class="rule"></div>
      <div class="t2">洪 州 道 韵</div>
      <div class="t3">南昌“一人得道”的千年文脉 · 水墨动画短片</div>
      <div id="play">开 始 播 放</div>
      <div id="hintline">建议全屏观看 · 约 5 分 10 秒 · 普通话配音 · 全程简体中文字幕</div>
    </div>
  </div>
</div>

<script>
"use strict";
/* =========================================================================
   文韵山河·洪州道韵  —— 纯代码（Canvas 2D）程序化水墨动画
   片长 305s｜结构：片头 15s → 第一章 95s → 第二章 105s → 第三章 77s → 片尾 13s
   ========================================================================= */

const W = 1920, H = 1080;

/* ---------------- 基础工具 ---------------- */
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=x=>x<=0?0:(x>=1?1:x*x*(3-2*x));
const sstep=(a,b,x)=>smooth(clamp((x-a)/(b-a),0,1));
const easeIO=t=>t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function rng(seed){let a=(seed>>>0)||1;return function(){a=(a+0x6D2B79F5)>>>0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296}}
function rgba(hex,a){
  if(hex[0]!=='#')return hex;
  let h=hex.slice(1); if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  const n=parseInt(h,16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
const CN='400 __SIZE__px "Noto Serif CJK SC","Source Han Serif SC","Songti SC","STSong",serif';
const CNK='400 __SIZE__px "Kaiti SC","STKaiti","KaiTi","Noto Serif CJK SC",serif';
function font(size,weight=400,kai=false){
  return `${weight} ${size}px ${kai?'"Kaiti SC","STKaiti","KaiTi",':''}"Noto Serif CJK SC","Source Han Serif SC","Songti SC","STSong",serif`;
}
function text(ctx,str,x,y,o={}){
  const {size=40,color='#1e2226',weight=400,kai=false,align='center',base='alphabetic',
         alpha=1,spacing=0,glow=0,glowColor='rgba(243,236,224,.9)',rotate=0,maxW=0}=o;
  ctx.save();
  ctx.globalAlpha*=alpha;
  ctx.font=font(size,weight,kai);
  ctx.textAlign=align; ctx.textBaseline=base;
  if('letterSpacing' in ctx) ctx.letterSpacing=spacing+'px';
  ctx.fillStyle=color;
  if(glow){ctx.shadowColor=glowColor;ctx.shadowBlur=glow;}
  const lines=String(str).split('\n');
  const lh=size*1.5;
  ctx.translate(x,y); if(rotate)ctx.rotate(rotate);
  lines.forEach((ln,i)=>{ ctx.fillText(ln,0,i*lh); });
  ctx.restore();
}
/* 竖排文字 */
function vtext(ctx,str,x,y,o={}){
  const {size=40,gap=1.14,color='#1e2226',weight=400,kai=true,alpha=1,align='center'}=o;
  ctx.save(); ctx.globalAlpha*=alpha;
  ctx.font=font(size,weight,kai);
  ctx.textAlign=align; ctx.textBaseline='middle'; ctx.fillStyle=color;
  [...str].forEach((ch,i)=>{ ctx.fillText(ch,x,y+i*size*gap); });
  ctx.restore();
}

/* ---------------- 宣纸底 ---------------- */
let PAPER=null, GRAIN=null;
function makePaper(){
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const g=c.getContext('2d');
  g.fillStyle='#f3ece0'; g.fillRect(0,0,W,H);
  // 大块色晕
  for(let i=0;i<70;i++){
    const r=rng(i*977+13);
    const x=r()*W,y=r()*H,rad=200+r()*700;
    const warm=r()>0.45;
    const grd=g.createRadialGradient(x,y,0,x,y,rad);
    grd.addColorStop(0,warm?'rgba(226,208,178,.16)':'rgba(198,204,198,.13)');
    grd.addColorStop(1,'rgba(243,236,224,0)');
    g.fillStyle=grd; g.fillRect(x-rad,y-rad,rad*2,rad*2);
  }
  // 纤维
  const r2=rng(2024);
  g.lineWidth=1;
  for(let i=0;i<2600;i++){
    const x=r2()*W,y=r2()*H,len=6+r2()*46,ang=(r2()-0.5)*0.9;
    g.strokeStyle=`rgba(${120+r2()*40|0},${110+r2()*40|0},${95+r2()*40|0},${0.02+r2()*0.035})`;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(ang)*len,y+Math.sin(ang)*len); g.stroke();
  }
  // 四角轻微水渍
  const vg=g.createRadialGradient(W*0.5,H*0.45,H*0.25,W*0.5,H*0.5,H*0.95);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(96,84,64,.16)');
  g.fillStyle=vg; g.fillRect(0,0,W,H);
  return c;
}
function makeGrain(){
  const s=512, c=document.createElement('canvas'); c.width=s;c.height=s;
  const g=c.getContext('2d'); const img=g.createImageData(s,s); const d=img.data;
  for(let i=0;i<d.length;i+=4){
    const v=200+Math.random()*55;
    d[i]=d[i+1]=d[i+2]=v; d[i+3]=18+Math.random()*22;
  }
  g.putImageData(img,0,0);
  return c;
}

/* ---------------- 山峦（分形水墨） ---------------- */
const HARM={};
function harm(seed,n=7){
  if(HARM[seed])return HARM[seed];
  const r=rng(seed*7919+17); const arr=[]; let tot=0;
  for(let i=0;i<n;i++){const a=Math.pow(0.62,i); arr.push({f:Math.pow(1.86,i),a,p:r()*6.2831}); tot+=a;}
  arr.forEach(o=>o.a/=tot);
  return HARM[seed]=arr;
}
function ridgeY(x,seed,scale,amp,base,ridged){
  const h=harm(seed); let v=0;
  for(const q of h){
    const si=Math.sin(x/scale*q.f+q.p);
    v+=q.a*(ridged?Math.sin(Math.abs(si)*Math.PI/2*2-Math.PI/2):si);
  }
  return base-amp*(0.52+0.5*v);
}
/* 一层山：湿边 + 皴擦 + 苔点 + 雾脚 */
let LOWQ=false;
/* 山峦缓存：静态图层预渲染，逐帧仅做位移贴图（大幅降低实时开销） */
const MCACHE=new Map(); const MCMAX=7; const MMARGIN=260;
function mountain(ctx,o){
  const sig=[o.seed,o.baseY,o.amp,o.scale,o.color,o.alpha,o.soft,o.texture,o.fog,o.fogH,o.ridged===false?'0':'1',LOWQ?'L':'H'].join('|');
  let c=MCACHE.get(sig);
  if(!c){
    const sc=0.78, w=Math.ceil((W+MMARGIN*2)*sc), h=Math.ceil(H*sc);
    c=document.createElement('canvas'); c.width=w; c.height=h;
    const g=c.getContext('2d');
    g.scale(sc,sc); g.translate(MMARGIN,0);
    drawMountainRaw(g,o);
    if(MCACHE.size>=MCMAX) MCACHE.delete(MCACHE.keys().next().value);
    MCACHE.set(sig,c);
  }
  const d=clamp(o.drift||0,-MMARGIN+20,MMARGIN-20);
  ctx.drawImage(c,-MMARGIN-d,0,W+MMARGIN*2,H);
}
function drawMountainRaw(ctx,o){
  const {seed=1,baseY=760,amp=200,scale=560,color='#2f353a',alpha=.9,
         drift=0,step=7,texture=1,fog=1,ridged=true,wet=.9,fogH=180,soft=4}=o;
  const pts=[];
  for(let x=-160;x<=W+160;x+=step) pts.push([x,ridgeY(x+drift,seed,scale,amp,baseY,ridged)]);
  ctx.save(); ctx.globalAlpha*=alpha;
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.lineTo(W+160,H+120); ctx.lineTo(-160,H+120); ctx.closePath();
  const top=Math.min(...pts.map(p=>p[1]));
  const g=ctx.createLinearGradient(0,top,0,baseY+amp*0.55);
  g.addColorStop(0,rgba(color,.96));
  g.addColorStop(.30,rgba(color,.62));
  g.addColorStop(.62,rgba(color,.24));
  g.addColorStop(1,rgba(color,0));
  ctx.save();
  if(soft>0&&!LOWQ) ctx.filter='blur('+soft+'px)';
  ctx.fillStyle=g; ctx.fill();
  ctx.restore();

  if(texture>0){
    ctx.save(); ctx.clip();
    const r=rng(seed*31+5);
    // 披麻皴：自山脊向下
    const tx0=LOWQ?0.45:1;
    for(let i=0;i<260*texture*tx0;i++){
      const px=r()*(W+260)-130;
      const rp=ridgeY(px+drift,seed,scale,amp,baseY,ridged);
      const py=rp+r()*r()*amp*0.62;
      const len=8+r()*52, sk=(r()-0.5)*0.6;
      const near=1-Math.min(1,(py-rp)/(amp*0.62));
      ctx.strokeStyle=rgba(color,(0.04+r()*0.1)*(0.4+near*0.9));
      ctx.lineWidth=0.6+r()*1.3;
      ctx.beginPath(); ctx.moveTo(px,py);
      ctx.quadraticCurveTo(px+sk*12,py+len*0.5,px+sk*22,py+len);
      ctx.stroke();
    }
    // 苔点
    for(let i=0;i<80*texture;i++){
      const px=r()*(W+200)-100;
      const py=ridgeY(px+drift,seed,scale,amp,baseY,ridged)+r()*amp*0.12;
      ctx.fillStyle=rgba(color,.18+r()*0.22);
      ctx.beginPath(); ctx.ellipse(px,py,1.6+r()*2.4,1.2+r()*1.8,r()*3,0,6.2832); ctx.fill();
    }
    ctx.restore();
  }
  // 湿边（山脊重墨）
  ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
  ctx.strokeStyle=rgba(color,.55*wet+0.2); ctx.lineWidth=2.6; ctx.lineJoin='round'; ctx.stroke();
  ctx.strokeStyle=rgba(color,.22); ctx.lineWidth=7; ctx.stroke();

  if(fog>0){
    const fg=ctx.createLinearGradient(0,baseY-amp*0.05,0,baseY+amp*0.52);
    fg.addColorStop(0,'rgba(246,240,230,0)');
    fg.addColorStop(.45,`rgba(246,240,230,${0.34*fog})`);
    fg.addColorStop(1,`rgba(246,240,230,${0.86*fog})`);
    ctx.fillStyle=fg; ctx.fillRect(-160,baseY-amp*0.05,W+320,amp*0.6+fogH*0.3);
  }
  ctx.restore();
}

/* ---------------- 水面 ---------------- */
function water(ctx,y0,h,t,o={}){
  const {tint='#5b6d70',refl=1,alpha=1,mist=1}=o;
  ctx.save(); ctx.globalAlpha*=alpha;
  const g=ctx.createLinearGradient(0,y0-h*0.18,0,y0+h);
  g.addColorStop(0,rgba(tint,0)); g.addColorStop(.18,rgba(tint,.16));
  g.addColorStop(.5,rgba(tint,.10)); g.addColorStop(1,rgba(tint,.04));
  ctx.fillStyle=g; ctx.fillRect(0,y0,W,h);
  // 倒影
  if(refl>0){
    const r=rng(77);
    for(let x=-20;x<W+20;x+=22){
      const a=(0.05+r()*0.13)*refl;
      const hh=h*(0.3+r()*0.62);
      const gg=ctx.createLinearGradient(0,y0,0,y0+hh);
      gg.addColorStop(0,rgba(tint,a)); gg.addColorStop(1,rgba(tint,0));
      ctx.fillStyle=gg; ctx.fillRect(x+Math.sin(t*0.4+x*0.01)*3,y0,2+r()*8,hh);
    }
  }
  // 波纹
  const r2=rng(101);
  for(let i=0;i<150;i++){
    const q=r2();
    const yy=y0+Math.pow(q,1.35)*h;
    const pers=(yy-y0)/h;
    const x=r2()*W+Math.sin(t*0.55+i)*10;
    const len=(30+r2()*300)*(0.35+pers*1.3);
    const a=(0.28-q*0.17)*(1-pers*0.35);
    ctx.strokeStyle=rgba(tint,a<0?0:a); ctx.lineWidth=0.7+r2()*1.9*(0.35+pers);
    ctx.beginPath();
    ctx.moveTo(x,yy);
    ctx.quadraticCurveTo(x+len*0.5,yy-Math.sin(t*1.2+i)*1.8,x+len,yy);
    ctx.stroke();
  }
  // 高光碎线
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(let i=0;i<26;i++){
    const q=r2();
    const yy=y0+q*q*h*0.9;
    const x=r2()*W;
    ctx.strokeStyle=`rgba(252,248,238,${0.05+q*0.09})`;
    ctx.lineWidth=1.2+q*2.4;
    ctx.beginPath(); ctx.moveTo(x,yy); ctx.lineTo(x+30+r2()*160,yy); ctx.stroke();
  }
  ctx.restore();
  if(mist>0){
    const mg=ctx.createLinearGradient(0,y0-h*0.22,0,y0+h*0.5);
    mg.addColorStop(0,'rgba(248,242,232,0)');
    mg.addColorStop(.35,`rgba(248,242,232,${0.55*mist})`);
    mg.addColorStop(1,'rgba(248,242,232,0)');
    ctx.fillStyle=mg; ctx.fillRect(0,y0-h*0.22,W,h*0.72);
  }
  ctx.restore();
}

/* ---------------- 通用：飞鸟 / 云 / 烟 ---------------- */
function birds(ctx,x,y,scale,t,color='#39403f',n=5,alpha=.6){
  const r=rng(9); ctx.save(); ctx.translate(x,y); ctx.scale(scale,scale);
  ctx.globalAlpha*=alpha; ctx.strokeStyle=color; ctx.lineWidth=2.2; ctx.lineCap='round';
  for(let i=0;i<n;i++){
    const bx=(r()-.5)*260, by=(r()-.5)*90;
    const w=8+r()*8, ph=t*2+ i*1.7;
    const fl=Math.sin(ph)*0.5+0.5;
    ctx.beginPath();
    ctx.moveTo(bx-w,by+w*0.55*fl); ctx.quadraticCurveTo(bx-w*0.35,by-w*0.5*fl,bx,by);
    ctx.quadraticCurveTo(bx+w*0.35,by-w*0.5*fl,bx+w,by+w*0.55*fl);
    ctx.stroke();
  }
  ctx.restore();
}
function cloudBand(ctx,y,h,t,alpha=.55,n=3){
  for(let k=0;k<n;k++){
    const yy=y+k*h*0.42+Math.sin(t*0.3+k)*6;
    const g=ctx.createLinearGradient(0,yy-h*0.3,0,yy+h*0.7);
    g.addColorStop(0,'rgba(255,252,246,0)');
    g.addColorStop(.45,`rgba(255,252,246,${alpha*(1-k*0.22)})`);
    g.addColorStop(1,'rgba(255,252,246,0)');
    ctx.fillStyle=g; ctx.fillRect(0,yy-h*0.3,W,h*1.05);
  }
}
function smoke(ctx,x,y,t,o={}){
  const {n=26,color='rgba(210,206,196,',life=7,spread=70,rise=260,alpha=.35,seed=3}=o;
  const r=rng(seed);
  ctx.save();
  for(let i=0;i<n;i++){
    const ph=((t/life)+(i/n))%1;
    const px=x+(r()-.5)*spread+(Math.sin(ph*6+i)*26)*(0.4+ph);
    const py=y-ph*rise;
    const rad=6+ph*40;

/* ---------------- 建筑：屋顶 --*/
function roofShape(ctx,cx,y,halfW,h,opt={}){
  const {ridgeHalf=0.32,eaveSag=0.09,curlUp=0.26}=opt;
  const rh=halfW*ridgeHalf, ry=y-h;
  ctx.beginPath();
  ctx.moveTo(cx-rh,ry);
  ctx.quadraticCurveTo(cx-halfW*0.72,y-h*0.44,cx-halfW,y);
  ctx.quadraticCurveTo(cx-halfW*1.06,y-h*0.02,cx-halfW*1.15,y-h*curlUp);
  ctx.quadraticCurveTo(cx-halfW*1.02,y-h*curlUp*0.5,cx-halfW*0.94,y+h*0.02);
  ctx.quadraticCurveTo(cx-halfW*0.48,y+h*eaveSag*1.35,cx,y+h*eaveSag);
  ctx.quadraticCurveTo(cx+halfW*0.48,y+h*eaveSag*1.35,cx+halfW*0.94,y+h*0.02);
  ctx.quadraticCurveTo(cx+halfW*1.02,y-h*curlUp*0.5,cx+halfW*1.15,y-h*curlUp);
  ctx.quadraticCurveTo(cx+halfW*1.06,y-h*0.02,cx+halfW,y);
  ctx.quadraticCurveTo(cx+halfW*0.72,y-h*0.44,cx+rh,ry);
  ctx.closePath();
}
function roof(ctx,cx,y,halfW,h,t,o={}){
  const {color='#3b4247',alpha=1,tiles=1,glow=0,ridgeHalf=0.32}=o;
  const rh=halfW*ridgeHalf, ry=y-h;
  ctx.save(); ctx.globalAlpha*=alpha;
  roofShape(ctx,cx,y,halfW,h,o);
  const g=ctx.createLinearGradient(0,ry,0,y+h*0.12);
  g.addColorStop(0,rgba(color,.99));
  g.addColorStop(.55,rgba(color,.9));
  g.addColorStop(1,rgba(color,.74));
  ctx.fillStyle=g; ctx.fill();
  if(tiles>0){
    ctx.save(); roofShape(ctx,cx,y,halfW,h,o); ctx.clip();
    const N=Math.max(6,Math.round(halfW/11));
    for(let i=-N;i<=N;i++){
      const px0=cx+rh*(i/N), px1=cx+halfW*1.06*(i/N);
      ctx.strokeStyle='rgba(16,20,22,.20)'; ctx.lineWidth=1.3;
      ctx.beginPath(); ctx.moveTo(px0,ry+2); ctx.lineTo(px1,y+h*0.06); ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,.05)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(px0+2,ry+2); ctx.lineTo(px1+2,y+h*0.06); ctx.stroke();
    }
    ctx.restore();
  }
  // 檐口（厚边）
  ctx.beginPath();
  ctx.moveTo(cx-halfW*1.15,y-h*0.26);
  ctx.quadraticCurveTo(cx-halfW*1.02,y-h*0.13,cx-halfW*0.94,y+h*0.02);
  ctx.quadraticCurveTo(cx-halfW*0.48,y+h*0.1215,cx,y+h*0.09);
  ctx.quadraticCurveTo(cx+halfW*0.48,y+h*0.1215,cx+halfW*0.94,y+h*0.02);
  ctx.quadraticCurveTo(cx+halfW*1.02,y-h*0.13,cx+halfW*1.15,y-h*0.26);
  ctx.strokeStyle='rgba(18,22,24,.65)'; ctx.lineWidth=5; ctx.lineCap='round'; ctx.stroke();
  ctx.strokeStyle='rgba(226,214,190,.28)'; ctx.lineWidth=1.6; ctx.stroke();
  // 正脊
  ctx.beginPath();
  ctx.moveTo(cx-rh,y);
  ctx.lineTo(cx-rh,ry-2);
  ctx.quadraticCurveTo(cx,ry-h*0.10,cx+rh,ry-2);
  ctx.lineTo(cx+rh,y);
  ctx.strokeStyle=rgba(color,1); ctx.lineWidth=6; ctx.lineJoin='round'; ctx.stroke();
  ctx.strokeStyle='rgba(226,214,190,.22)'; ctx.lineWidth=1.8; ctx.stroke();
  // 鸱吻
  [-1,1].forEach(d=>{
    ctx.beginPath();
    ctx.moveTo(cx+d*rh,ry);
    ctx.quadraticCurveTo(cx+d*rh*1.1,ry-h*0.16,cx+d*rh*0.92,ry-h*0.20);
    ctx.strokeStyle=rgba(color,1); ctx.lineWidth=4; ctx.stroke();
  });
  if(glow>0){
    ctx.beginPath();
    ctx.moveTo(cx-halfW*1.15,y-h*0.26);
    ctx.quadraticCurveTo(cx,y+h*0.13,cx+halfW*1.15,y-h*0.26);
    ctx.strokeStyle=`rgba(238,206,150,${0.3*glow})`; ctx.lineWidth=5; ctx.stroke();
  }
  ctx.restore();
}

  ctx.beginPath(); ctx.moveTo(0,y-100); ctx.lineTo(0,y-124); ctx.strokeStyle='rgba(176,141,87,.9)'; ctx.lineWidth=2.2; ctx.stroke();
  ctx.restore();

  ctx.save(); ctx.globalAlpha*=alpha; ctx.translate(x,y); ctx.rotate(rot); ctx.scale(s,s);
  ctx.fillStyle='rgba(58,52,46,.9)';
  ctx.beginPath(); ctx.ellipse(0,0,16,11,-0.15,0,6.2832); ctx.fill();     // 身
  ctx.beginPath(); ctx.arc(13,-8,6.5,0,6.2832); ctx.fill();                // 头
  ctx.beginPath(); ctx.moveTo(19,-8); ctx.lineTo(26,-5); ctx.lineTo(19,-2); ctx.closePath(); ctx.fill(); // 喙
  ctx.beginPath(); ctx.moveTo(13,-14); ctx.quadraticCurveTo(9,-22,15,-19); ctx.quadraticCurveTo(18,-20,17,-13); ctx.fill();
  ctx.strokeStyle='rgba(58,52,46,.9)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(-6,10); ctx.lineTo(-8,20); ctx.moveTo(6,10); ctx.lineTo(8,20); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-15,-2); ctx.quadraticCurveTo(-26,-12,-24,-20); ctx.quadraticCurveTo(-18,-8,-14,2); ctx.fill();
  ctx.restore();
}
function dog(ctx,x,y,s,rot,alpha){
  ctx.save(); ctx.globalAlpha*=alpha; ctx.translate(x,y); ctx.rotate(rot); ctx.scale(s,s);
  ctx.fillStyle='rgba(58,52,46,.9)';
  ctx.beginPath(); ctx.ellipse(0,0,20,10,0,0,6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(18,-8,7,0,6.2832); ctx.fill();
  ctx.beginPath(); ctx.moveTo(22,-12); ctx.lineTo(30,-18); ctx.lineTo(26,-6); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-18,-2); ctx.quadraticCurveTo(-34,-14,-30,-24); ctx.quadraticCurveTo(-24,-12,-16,2); ctx.fill();
  ctx.strokeStyle='rgba(58,52,46,.9)'; ctx.lineWidth=2.4;
  ctx.beginPath(); ctx.moveTo(-10,8); ctx.lineTo(-12,20); ctx.moveTo(8,8); ctx.lineTo(10,20); ctx.stroke();
  ctx.restore();
}

/* =========================================================
   数字人：古风学者（AI 数字人形象 · 程序化水墨半身像）
   ========================================================= */
function scholar(ctx,cx,by,s,t,o={}){
  const {alpha=1,speak=0,glow=.5,mode='calm'}=o;
  ctx.save();
  ctx.globalAlpha*=alpha;
  ctx.translate(cx,by); ctx.scale(s,s);
  const breathe=1+Math.sin(t*0.85)*0.008;
  const nod=Math.sin(t*0.62)*0.012+(mode==='talk'?Math.sin(t*1.9)*0.006:0);
  ctx.rotate(nod); ctx.scale(1,breathe);

  const INK='#2a2f33', INK2='#3b4247', SKIN='rgba(226,210,186,.96)';

  // —— 光晕
  const gl=ctx.createRadialGradient(0,-200,20,0,-200,340);
  gl.addColorStop(0,`rgba(232,208,164,${0.16*glow})`);
  gl.addColorStop(.6,`rgba(180,198,196,${0.07*glow})`);
  gl.addColorStop(1,'rgba(232,208,164,0)');
  ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(0,-200,340,0,6.2832); ctx.fill();

  // —— 袍身
  ctx.beginPath();
  ctx.moveTo(-30,-268);
  ctx.bezierCurveTo(-96,-250,-138,-176,-150,-10);
  ctx.lineTo(-150,6); ctx.lineTo(150,6); ctx.lineTo(150,-10);
  ctx.bezierCurveTo(140,-176,96,-250,30,-268);
  ctx.closePath();
  const bg=ctx.createLinearGradient(-140,-270,130,10);
  bg.addColorStop(0,rgba(INK2,.96)); bg.addColorStop(.5,rgba(INK,.9)); bg.addColorStop(1,rgba(INK2,.82));
  ctx.fillStyle=bg; ctx.fill();
  // 衣纹
  const rw=rng(41);
  ctx.strokeStyle='rgba(243,236,224,.16)'; ctx.lineWidth=1.6;
  for(let i=0;i<9;i++){
    const x0=-120+i*30;
    ctx.beginPath(); ctx.moveTo(x0,-250+rw()*20);
    ctx.quadraticCurveTo(x0+14+rw()*20,-120,x0-8+rw()*24,0);
    ctx.stroke();
  }
  // 交领
  ctx.beginPath();
  ctx.moveTo(-34,-266); ctx.quadraticCurveTo(-2,-214,30,-262);
  ctx.lineTo(30,-238); ctx.quadraticCurveTo(-2,-190,-34,-240);
  ctx.closePath();
  ctx.fillStyle='rgba(238,230,214,.92)'; ctx.fill();
  ctx.strokeStyle='rgba(60,56,50,.35)'; ctx.lineWidth=1.2; ctx.stroke();
  // 前襟暗线
  ctx.beginPath(); ctx.moveTo(-10,-200); ctx.quadraticCurveTo(3,-120,-2,4);
  ctx.strokeStyle='rgba(243,236,224,.18)'; ctx.lineWidth=2; ctx.stroke();
  // 腰带
  ctx.fillStyle='rgba(150,110,70,.55)'; ctx.fillRect(-96,-104,196,16);
  ctx.strokeStyle='rgba(232,208,164,.35)'; ctx.lineWidth=1.2; ctx.strokeRect(-96,-104,196,16);

  // —— 颈部
  ctx.beginPath();
  ctx.moveTo(-24,-302); ctx.quadraticCurveTo(-26,-272,-14,-266);
  ctx.lineTo(14,-266); ctx.quadraticCurveTo(26,-272,24,-302);
  ctx.closePath(); ctx.fillStyle='#c8b294'; ctx.fill();

  // —— 头
  const hx=0, hy=-352;
  ctx.beginPath(); ctx.ellipse(hx,hy,45,54,0,0,6.2832);
  ctx.fillStyle=SKIN; ctx.fill();
  ctx.strokeStyle='rgba(70,62,52,.35)'; ctx.lineWidth=1.2; ctx.stroke();
  // 面部明暗
  const fg=ctx.createLinearGradient(hx+40,hy-40,hx-40,hy+40);
  fg.addColorStop(0,'rgba(90,72,54,.16)'); fg.addColorStop(.6,'rgba(90,72,54,0)');
  ctx.fillStyle=fg; ctx.beginPath(); ctx.ellipse(hx,hy,45,54,0,0,6.2832); ctx.fill();

  // —— 发 / 冠
  ctx.beginPath();
  ctx.moveTo(-44,hy-14);
  ctx.quadraticCurveTo(-50,hy-64,0,hy-70);
  ctx.quadraticCurveTo(50,hy-64,44,hy-14);
  ctx.quadraticCurveTo(36,hy-42,0,hy-46);
  ctx.quadraticCurveTo(-36,hy-42,-44,hy-14);
  ctx.closePath(); ctx.fillStyle=rgba(INK,.98); ctx.fill();
  // 发髻
  ctx.beginPath(); ctx.ellipse(0,hy-78,20,14,0,0,6.2832); ctx.fillStyle=rgba(INK,.98); ctx.fill();
  // 幞头 / 进贤冠
  ctx.beginPath();
  ctx.moveTo(-40,hy-58);
  ctx.quadraticCurveTo(-46,hy-96,-10,hy-104);
  ctx.lineTo(16,hy-104);
  ctx.quadraticCurveTo(46,hy-94,38,hy-58);
  ctx.quadraticCurveTo(6,hy-70,-40,hy-58);
  ctx.closePath(); ctx.fillStyle='rgba(46,52,56,.97)'; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-10,hy-104); ctx.quadraticCurveTo(4,hy-122,20,hy-108);
  ctx.strokeStyle='rgba(46,52,56,.97)'; ctx.lineWidth=6; ctx.stroke();
  // 鬓
  [-1,1].forEach(d=>{
    ctx.beginPath(); ctx.moveTo(d*42,hy-30);
    ctx.quadraticCurveTo(d*50,hy+8,d*38,hy+30);
    ctx.strokeStyle=rgba(INK,.9); ctx.lineWidth=7; ctx.lineCap='round'; ctx.stroke();
  });

  // —— 五官（写意）
  const blink=Math.sin(t*1.1)>0.985?0.15:1;
  ctx.strokeStyle='rgba(40,44,48,.9)'; ctx.lineCap='round';
  [-1,1].forEach(d=>{
    // 眉
    ctx.lineWidth=3.4;
    ctx.beginPath(); ctx.moveTo(d*12,hy-24);
    ctx.quadraticCurveTo(d*28,hy-32,d*38,hy-22); ctx.stroke();
    // 眼
    ctx.lineWidth=2.6;
    ctx.beginPath(); ctx.moveTo(d*14,hy-8);
    ctx.quadraticCurveTo(d*25,hy-14*blink,d*36,hy-6); ctx.stroke();
  });
  // 鼻
  ctx.lineWidth=2.2; ctx.beginPath();
  ctx.moveTo(-1,hy-16); ctx.quadraticCurveTo(2,hy+4,8,hy+8); ctx.stroke();
  // 口（说话时开合）
  const mo=2+speak*9*(0.5+0.5*Math.sin(t*13.1));
  ctx.beginPath(); ctx.ellipse(0,hy+24,11,mo*0.5,0,0,6.2832);
  ctx.fillStyle='rgba(96,44,40,.6)'; ctx.fill();
  ctx.strokeStyle='rgba(60,48,44,.7)'; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.moveTo(-11,hy+24-mo*0.3); ctx.quadraticCurveTo(0,hy+24-mo*0.55,11,hy+24-mo*0.3); ctx.stroke();

  // —— 髯（长须）
  ctx.strokeStyle=rgba('#3a3f43',.92); ctx.lineCap='round';
  for(let i=0;i<7;i++){
    const off=(i-3)*7;
    const sw=Math.sin(t*0.9+i*0.4)*2.2;
    ctx.lineWidth=4.6-Math.abs(i-3)*0.4;
    ctx.beginPath();
    ctx.moveTo(off*0.6,hy+34);
    ctx.bezierCurveTo(off*1.4+sw,hy+80,off*1.7-sw,hy+120,off*1.2+sw*1.4,hy+152);
    ctx.stroke();
  }
  // 八字须
  [-1,1].forEach(d=>{
    ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(d*4,hy+18);
    ctx.quadraticCurveTo(d*14,hy+26,d*22,hy+46); ctx.stroke();
  });

  // —— 手持卷轴（右）
  ctx.save();
  ctx.translate(104,-166); ctx.rotate(-0.16+Math.sin(t*0.7)*0.02);
  ctx.fillStyle='rgba(238,230,214,.95)'; ctx.fillRect(-6,-30,12,62);
  ctx.fillStyle='rgba(150,110,70,.9)'; ctx.fillRect(-8,-34,16,7); ctx.fillRect(-8,32,16,7);
  ctx.strokeStyle='rgba(120,96,66,.5)'; ctx.lineWidth=1; 
  for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(-4,-20+i*12);ctx.lineTo(4,-20+i*12);ctx.stroke();}
  // 手
  ctx.beginPath(); ctx.ellipse(0,0,15,11,-0.2,0,6.2832); ctx.fillStyle='#cbb496'; ctx.fill();
  ctx.restore();
  // 左袖
  ctx.beginPath();
  ctx.moveTo(-140,-40); ctx.quadraticCurveTo(-118,-150,-84,-232);
  ctx.quadraticCurveTo(-108,-160,-118,-30); ctx.closePath();
  ctx.fillStyle='rgba(30,34,38,.55)'; ctx.fill();

  // —— 数字感：边缘微光 + 粒子
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  const rp=rng(88);
  for(let i=0;i<26;i++){
    const ph=(t*0.16+rp())%1;
    const px=(rp()-.5)*300, py=-60-ph*330;
    const a=Math.sin(Math.PI*ph)*0.5;
    ctx.fillStyle=`rgba(226,206,164,${a*0.5})`;
    ctx.beginPath(); ctx.arc(px,py,1.2+rp()*2.2,0,6.2832); ctx.fill();
  }
  ctx.restore();
  ctx.restore();
}

/* —— 片头：水墨长卷 —— */
function shotTitle(ctx,t,lt,dur){
  ctx.drawImage(PAPER,0,0);
  wash(ctx,'#e9e2d2','#f3ece0',0,H,0.5);
  const a1=sstep(0,2.2,lt), a2=sstep(1.2,3.6,lt), a3=sstep(2.6,5.2,lt);
  sunGlow(ctx,W*0.72,H*0.3,520,'#e8cf9e',0.28*sstep(0,3,lt));
  // 远山
  ctx.save(); ctx.globalAlpha=a1;
  mountain(ctx,{seed:3,baseY:H*0.62,amp:210,scale:640,color:'#8b949a',alpha:.55,drift:-lt*4,fog:1.1,texture:.5});
  ctx.restore();
  ctx.save(); ctx.globalAlpha=a2;
  mountain(ctx,{seed:7,baseY:H*0.68,amp:250,scale:460,color:'#5c666c',alpha:.72,drift:-lt*7,fog:.9,texture:.8});
  ctx.restore();
  // 水
  water(ctx,H*0.66,H*0.34,t,{tint:'#63757a',alpha:.9});
  ctx.save(); ctx.globalAlpha=a3; mountain(ctx,{seed:11,baseY:H*0.9,amp:120,scale:380,color:'#333b40',alpha:.55,drift:-lt*15,fog:.5,texture:.6}); ctx.restore();
  // 滕王阁
  const ta=sstep(3.2,6.2,lt);
  if(ta>0){
    // 岸线
    ctx.save(); ctx.globalAlpha=ta*.9;
    ctx.beginPath();
    ctx.moveTo(W*0.62,H*0.755);
    ctx.quadraticCurveTo(W*0.78,H*0.735,W+40,H*0.75);
    ctx.lineTo(W+40,H); ctx.lineTo(W*0.62,H); ctx.closePath();
    ctx.fillStyle='rgba(96,96,84,.35)'; ctx.fill();
    ctx.restore();
    ctx.save(); ctx.globalAlpha=ta;
    tengwangge(ctx,W*0.78,H*0.748,0.68,t,{alpha:1});
    ctx.restore();
  }
  birds(ctx,W*0.3,H*0.28,1.1,t,'#4a5350',6,.5*a1);

  // 标题
  const ta1=sstep(7.4,9.4,lt), ta2=sstep(8.6,10.6,lt), ta3=sstep(10.2,12,lt);
  if(ta1>0){
    ctx.save();
    ctx.globalAlpha=ta1;
    const blur=lerp(26,2,ta1);
    ctx.shadowColor='rgba(40,40,40,.4)'; ctx.shadowBlur=blur;
    text(ctx,'文韵山河·洪州道韵',W/2,H*0.42+lerp(10,0,ta1),{size:132,color:'#20262a',spacing:16,weight:500,kai:false,alpha:1});
    ctx.restore();
    // 副题
    text(ctx,'南昌“一人得道”的千年文脉',W/2,H*0.42+96,{size:44,color:'rgba(60,66,70,.82)',spacing:10,alpha:ta2});
    // 朱线
    ctx.save(); ctx.globalAlpha=ta2*.8;
    const lw=520*ta2;
    const lg=ctx.createLinearGradient(W/2-lw/2,0,W/2+lw/2,0);
    lg.addColorStop(0,'rgba(166,58,50,0)'); lg.addColorStop(.5,'rgba(166,58,50,.6)'); lg.addColorStop(1,'rgba(166,58,50,0)');
    ctx.fillStyle=lg; ctx.fillRect(W/2-lw/2,H*0.42+130,lw,2); ctx.restore();
    if(ta3>0){ seal(ctx,W/2+318,H*0.42+178,0.8,-0.07,['文韵','山河']); }
    text(ctx,'— 申 报 片 名 —',W/2,H*0.42-158,{size:24,color:'rgba(120,104,78,.65)',spacing:10,alpha:ta1});
  }
  frame(ctx,.5*sstep(0,2,lt));
}

  ctx.restore();
  // 官帽（幞头）
  ctx.save(); ctx.translate(W*0.36,H*0.925); ctx.rotate(0.08); ctx.scale(1.8,1.8);
  ctx.fillStyle='rgba(40,44,48,.9)';
  ctx.beginPath(); ctx.ellipse(0,0,26,12,0,0,6.2832); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-20,-4); ctx.quadraticCurveTo(0,-26,20,-4); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(40,44,48,.9)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(-22,-8); ctx.quadraticCurveTo(-38,-14,-44,-6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(22,-8); ctx.quadraticCurveTo(38,-14,44,-6); ctx.stroke();

/* —— 斩蛟治水 —— */
function waveHump(ctx,x,y,s,ph,alpha=1){
  ctx.save(); ctx.globalAlpha*=alpha; ctx.translate(x,y); ctx.scale(s,s);
  const b=Math.sin(ph)*6;
  ctx.beginPath();
  ctx.moveTo(-230,60);
  ctx.bezierCurveTo(-170,-30+b,-90,-72+b,-6,-58+b);
  ctx.bezierCurveTo(70,-46,130,-18,214,60);
  ctx.closePath();
  const g=ctx.createLinearGradient(0,-76,0,60);
  g.addColorStop(0,'rgba(38,48,52,.95)'); g.addColorStop(.6,'rgba(74,88,90,.75)'); g.addColorStop(1,'rgba(120,132,130,.2)');
  ctx.fillStyle=g; ctx.fill();

/* 一条商路 */
function route(ctx,from,to,prog,t,alpha=1,warm='rgba(166,58,50,'){
  if(prog<=0)return;
  const [x0,y0]=from,[x1,y1]=to;
  const mx=(x0+x1)/2+(y1-y0)*0.16, my=(y0+y1)/2-(x1-x0)*0.16;
  const N=120; const pts=[];
  for(let i=0;i<=N;i++){
    const p=i/N, u=1-p;
    pts.push([u*u*x0+2*u*p*mx+p*p*x1, u*u*y0+2*u*p*my+p*p*y1]);
  }
  const len=Math.sqrt((x1-x0)**2+(y1-y0)**2)*1.2;
  ctx.save(); ctx.globalAlpha*=alpha;
  ctx.setLineDash([len*prog,len]);
  ctx.strokeStyle=warm+'0.62)'; ctx.lineWidth=3; ctx.lineCap='round';
  ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke();
  ctx.setLineDash([]);
  // 行进的点
  if(prog>0.98){
    const ph=((t*0.16)%1);
    const idx=Math.floor(ph*N);
    const [px,py]=pts[idx];
    ctx.fillStyle=warm+'0.9)';
    ctx.beginPath(); ctx.arc(px,py,4,0,6.2832); ctx.fill();
  }
  ctx.restore();
}
function cityDot(ctx,x,y,name,a,hi=false){

  if(hi){
    ctx.fillStyle='rgba(166,58,50,.14)';

  }
  ctx.fillStyle=hi?'rgba(166,58,50,.95)':'rgba(70,74,70,.8)';
  ctx.beginPath(); ctx.arc(x,y,hi?7:4,0,6.2832); ctx.fill();

  ctx.restore();
}

function streetSide(ctx,side,t){

  ctx.beginPath();

  for(const [x,y] of top) ctx.lineTo(X(x+ (x===0?150:0)*0),y);
  ctx.lineTo(X(470),H); ctx.closePath();
  const wg=ctx.createLinearGradient(0,H*0.2,0,H);
  wg.addColorStop(0,'rgba(226,214,192,.97)'); wg.addColorStop(.5,'rgba(196,182,160,.96)'); wg.addColorStop(1,'rgba(120,108,92,.9)');

  const rw=rng(dir<0?61:67);
  for(let i=0;i<26;i++){
    const x=rw()*500, y=H-40-rw()*120;

    ctx.beginPath(); ctx.ellipse(X(x),y,10+rw()*26,6+rw()*16,0,0,6.2832); ctx.fill();
  }
  ctx.restore();
  // 檐口（黛瓦）
  for(let i=0;i<top.length-1;i+=2){
    const [x1,y1]=top[i], [x2]=top[i+1];
    const l=Math.min(x1,x2)-12, r=Math.max(x1,x2)+12;
    ctx.beginPath();
    ctx.moveTo(X(l),y1+4); ctx.lineTo(X(l),y1-22);
    ctx.quadraticCurveTo(X((l+r)/2),y1-30,X(r),y1-22);

    ctx.fillStyle='rgba(40,46,52,.96)'; ctx.fill();

    // 瓦当滴水
    ctx.fillStyle='rgba(26,32,36,.92)';
    for(let x=l;x<r;x+=14){ ctx.fillRect(X(x),y1+4,8,6); }
  }
  // 木格窗
  for(let i=0;i<4;i++){
    const p=i/4;
    const t0=top[0], t1=top[top.length-1];

    const w=44-i*3, h=58-i*4;

    ctx.strokeStyle='rgba(60,50,40,.85)'; ctx.lineWidth=2.4;
    ctx.strokeRect(X(baseX),baseY,w,h);
    ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(X(baseX+w/2),baseY); ctx.lineTo(X(baseX+w/2),baseY+h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(X(baseX),baseY+h/2); ctx.lineTo(X(baseX+w),baseY+h/2); ctx.stroke();
  }
  // 檐下灯笼
  for(let i=0;i<5;i++){
    const p=i/5;

    ctx.beginPath(); ctx.moveTo(X(x),y-40-p*10); ctx.lineTo(X(x),y-18); ctx.stroke();
  }
}

/* —— 当代南昌 · 赣江夜色 —— */
function shotCity(ctx,t,lt,dur){
  ctx.drawImage(PAPER,0,0);
  wash(ctx,'#1a222a','#4e5962',0,H,0.97);

  const rs=rng(220);

    ctx.beginPath(); ctx.arc(rs()*W,rs()*H*0.42,0.6+rs()*1.3,0,6.2832); ctx.fill();
  }
  // 远山
  mountain(ctx,{seed:701,baseY:H*0.66,amp:110,scale:720,color:'#2c373e',alpha:.5,texture:.3,fog:.6,soft:6});
  const base=H*0.72;
  // 地平线暖雾
  sunGlow(ctx,W*0.5,base,620,'#c8865a',0.12);
  // 楼群
  const r=rng(211);
  let x=-40;
  while(x<W+40){
    const bw=56+r()*108, bh=70+r()*240;
    ctx.fillStyle=`rgba(14,20,26,${0.85+r()*0.15})`;
    ctx.fillRect(x,base-bh,bw,bh);
    if(r()>.55){ ctx.fillStyle='rgba(232,184,116,.28)'; ctx.fillRect(x+4,base-bh-4,bw-8,4); }
    for(let yy=base-bh+14; yy<base-12; yy+=26){
      for(let xx=x+8; xx<x+bw-10; xx+=18){
        if(r()>0.58){ ctx.fillStyle=`rgba(234,194,134,${0.1+r()*0.34})`; ctx.fillRect(xx,yy,8,10); }
      }
    }
    x+=bw+4+r()*24;
  }
  // 双子塔
  const tw=(cx)=>{
    const h=370,w=56;
    ctx.fillStyle='rgba(12,18,24,.97)';
    ctx.beginPath();
    ctx.moveTo(cx-w/2,base); ctx.lineTo(cx-w*0.39,base-h);
    ctx.lineTo(cx+w*0.39,base-h); ctx.lineTo(cx+w/2,base); ctx.closePath(); ctx.fill();
    for(let i=0;i<15;i++){
      ctx.fillStyle=`rgba(234,192,126,${0.22+0.32*Math.abs(Math.sin(i*1.3+t*0.7))})`;
      ctx.fillRect(cx-w*0.34,base-h+22+i*23,w*0.68,4);
    }
    ctx.fillStyle='rgba(226,180,116,.5)';
    ctx.fillRect(cx-w*0.39,base-h-3,w*0.78,3);
  };
  tw(W*0.585); tw(W*0.655);
  // 摩天轮
  const fx=W*0.885, fy=H*0.36, fr=112;
  ctx.save();
  ctx.strokeStyle='rgba(18,24,30,.95)'; ctx.lineWidth=6;
  ctx.beginPath(); ctx.arc(fx,fy,fr,0,6.2832); ctx.stroke();
  ctx.lineWidth=2;
  for(let i=0;i<18;i++){
    const a2=i/18*6.2832+t*0.1;
    ctx.beginPath(); ctx.moveTo(fx,fy); ctx.lineTo(fx+Math.cos(a2)*fr,fy+Math.sin(a2)*fr); ctx.stroke();
    ctx.fillStyle=`rgba(238,196,132,${0.5+0.45*Math.sin(t*2+i)})`;
    ctx.beginPath(); ctx.arc(fx+Math.cos(a2)*fr,fy+Math.sin(a2)*fr,4.2,0,6.2832); ctx.fill();
  }
  ctx.strokeStyle='rgba(18,24,30,.95)'; ctx.lineWidth=7;
  ctx.beginPath(); ctx.moveTo(fx-fr*0.55,base); ctx.lineTo(fx,base-46); ctx.lineTo(fx+fr*0.55,base); ctx.stroke();
  ctx.restore();
  // 赣江
  water(ctx,base+6,H-base-6,t,{tint:'#8f9a9a',alpha:.5,refl:1.5,mist:.22});
  // 倒影光带
  ctx.save(); ctx.globalCompositeOperation='lighter';
  const rp=rng(231);
  for(let i=0;i<44;i++){
    const xx=rp()*W, hh=50+rp()*180;
    const g=ctx.createLinearGradient(0,base+6,0,base+6+hh);
    g.addColorStop(0,`rgba(232,182,112,${0.08+rp()*0.2})`); g.addColorStop(1,'rgba(232,182,112,0)');
    ctx.fillStyle=g; ctx.fillRect(xx,base+6,2+rp()*5,hh);
  }
  ctx.restore();
  // 滕王阁（灯火）
  ctx.save();
  const g2=ctx.createRadialGradient(W*0.2,base-120,20,W*0.2,base-120,300);
  g2.addColorStop(0,'rgba(238,196,132,.20)'); g2.addColorStop(1,'rgba(238,196,132,0)');
  ctx.fillStyle=g2; ctx.beginPath(); ctx.arc(W*0.2,base-120,300,0,6.2832); ctx.fill();
  tengwangge(ctx,W*0.19,base,0.85,t,{ink:'#232a30',wall:'#e6d8bc',pillar:'#8a463c'});
  ctx.restore();
  // 游船
  boat(ctx,W*0.58,H*0.87,0.72,t,{alpha:.45,phase:2});
  boat(ctx,W*0.4,H*0.94,0.95,t,{alpha:.3,phase:4});
  // 岸边人群
  crowd(ctx,base+2,t,18,{color:'#080b0d',alpha:.65,scale:1.15,seed:61});
  frame(ctx,.45);
}

  ctx.fillStyle='rgba(30,32,32,.9)';
  ctx.beginPath(); ctx.ellipse(0,-2,26,8,0,0,6.2832); ctx.fill();

  ctx.fillStyle='rgba(40,36,32,.95)';

  ctx.strokeStyle='rgba(80,72,60,.6)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(lx,ly-60); ctx.lineTo(lx,ly); ctx.stroke();
  const g=ctx.createRadialGradient(lx,ly+20,4,lx,ly+20,240);
  g.addColorStop(0,'rgba(244,200,132,.5)'); g.addColorStop(.35,'rgba(232,178,110,.18)'); g.addColorStop(1,'rgba(232,178,110,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(lx,ly+20,240,0,6.2832); ctx.fill();
  ctx.fillStyle='rgba(226,168,96,.95)';
  ctx.beginPath(); ctx.ellipse(lx,ly+18,16,22,0,0,6.2832); ctx.fill();
  ctx.restore();
  // 师徒剪影
  ctx.save();
  ctx.fillStyle='rgba(44,46,44,.85)';
  // 师（坐）
  ctx.beginPath(); ctx.ellipse(W*0.62,H*0.6,42,58,0,0,6.2832); ctx.fill();

  const rp=rng(170);

/* —— 尾声升华 —— */
function shotFinale(ctx,t,lt,dur){
  ctx.drawImage(PAPER,0,0);
  wash(ctx,'#eae3d3','#f5efe3',0,H,0.65);
  sunGlow(ctx,W*0.5,H*0.36,620,'#eed6a4',0.26);

  water(ctx,H*0.74,H*0.26,t,{tint:'#6d7c7e',alpha:.8});
  tengwangge(ctx,W*0.84,H*0.7,0.42,t,{alpha:.6});
  // 光带（文脉流转）
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(let k=0;k<3;k++){
    ctx.beginPath();
    for(let x=0;x<=W;x+=14){
      const y=H*0.62-k*34+Math.sin(x*0.006+t*0.7+k)*18;

    }
    ctx.strokeStyle=`rgba(226,196,140,${0.14-k*0.03})`; ctx.lineWidth=10-k*2; ctx.stroke();
  }
  ctx.restore();
  // 主标题
  const a=sstep(3,6,lt);
  ctx.save(); ctx.globalAlpha=a;
  text(ctx,'文韵山河 · 洪州道韵',W*0.5,H*0.34,{size:92,color:'#20262a',spacing:14,kai:false,weight:500,glow:14,glowColor:'rgba(243,236,224,.9)'});
  ctx.restore();

  if(a>0.5) seal(ctx,W*0.5+330,H*0.34-40,1.0,-0.06,['文韵','山河']);
  // 社会主义核心价值观
  const va=sstep(7,9.5,lt)*0.5;

    text(ctx,r,W*0.5,H*0.82+i*38,{size:24,color:'rgba(96,88,70,.9)',spacing:8,alpha:va});

  frame(ctx,.5);
}

/* ---------------- 字幕绘制 ---------------- */
function subIndexAt(t){
  for(let i=0;i<SUBS.length;i++){ if(t>=SUBS[i][0]&&t<=SUBS[i][1]) return i; }
  return -1;
}
let SUB_ON=true;
const LUMC=document.createElement('canvas'); LUMC.width=48; LUMC.height=8;
const LUMG=LUMC.getContext('2d');
let lumCache=0.75,lumFrame=-9;
function bandLum(t){
  if(Math.abs(t-lumFrame)<0.15)return lumCache;
  lumFrame=t;
  try{
    LUMG.clearRect(0,0,48,8);
    LUMG.drawImage(cv,0,H-330,W,220,0,0,48,8);
    const d=LUMG.getImageData(0,0,48,8).data;
    let sum=0,n=0;
    for(let i=0;i<d.length;i+=4){ sum+=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]; n++; }
    lumCache=(sum/n)/255;
  }catch(e){}
  return lumCache;
}
function drawSub(ctx,t){
  if(!SUB_ON)return;
  const si=subIndexAt(t);
  if(si<0)return;
  const [a,b,txt]=SUBS[si];
  const alpha=Math.min(1,(t-a)/0.28,(b-t)/0.3);
  if(alpha<=0)return;
  const size=44;
  ctx.save();
  ctx.globalAlpha=Math.max(0,alpha);
  ctx.font=font(size,500);
  const maxW=W*0.76;
  const chars=[...txt]; let lines=[],line='';
  for(const ch of chars){
    if(ctx.measureText(line+ch).width>maxW){lines.push(line);line=ch;}else line+=ch;
  }
  if(line)lines.push(line);
  const ly=H-172-(lines.length-1)*62;
  const lum=bandLum(t);
  const darkBg=lum<0.52;
  const fg=darkBg?'rgba(250,246,236,.97)':'rgba(22,26,28,.97)';
  const glowColor=darkBg?'rgba(10,12,14,.85)':'rgba(248,243,232,.95)';
  lines.forEach((ln,i)=>{
    const y=ly+i*62;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font=font(size,500);
    if('letterSpacing' in ctx)ctx.letterSpacing='2px';
    ctx.shadowColor=glowColor; ctx.shadowBlur=16;
    ctx.fillStyle=fg;
    ctx.fillText(ln,W/2,y);
    ctx.shadowBlur=10;
    ctx.fillText(ln,W/2,y);
    ctx.shadowBlur=0;
    ctx.fillText(ln,W/2,y);
  });
  ctx.restore();
}

/* ---------------- 章节卡 ---------------- */
function drawChapterCard(ctx,t){
  for(const c of CHAPTERS){
    if(!c.n)continue;
    const dt=t-c.t0;
    if(dt<0||dt>7)continue;
    const a=Math.min(sstep(0.4,1.5,dt),1-sstep(5.4,6.9,dt));
    if(a<=0)continue;
    ctx.save(); ctx.globalAlpha=a;
    const x=W-190, y=H*0.3;
    // 竖排
    vtext(ctx,c.n,x,y,{size:26,color:'rgba(70,66,54,.85)',gap:1.3});
    vtext(ctx,c.name,x-58,y+16,{size:74,color:'#20262a',gap:1.12});
    vtext(ctx,c.sub,x-122,y+16+ (c.name.length*74*1.12),{size:26,color:'rgba(120,104,78,.85)',gap:1.3});
    // 朱线
    ctx.strokeStyle='rgba(166,58,50,.55)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(x+46,y-16); ctx.lineTo(x+46,y+150); ctx.stroke();
    ctx.restore();
    seal(ctx,x-30,y+230,0.78,-0.07,[c.name.slice(0,2),c.name.slice(2,4)]);
  }
}

/* ---------------- 墨迹转场 ---------------- */
let lastShot=-1, wipeT=-99;
function drawWipe(ctx,t){
  const dt=t-wipeT;
  if(dt<0||dt>1.0)return;
  const p=dt/1.0;
  let r,a;
  if(p<0.38){ r=(p/0.38)*2400; a=1; }
  else { r=2400; a=1-(p-0.38)/0.62; }
  const seed=Math.floor(wipeT*13)+7;
  const rr=rng(seed);
  ctx.save();
  ctx.globalAlpha=Math.max(0,a);
  ctx.beginPath();
  const n=72;
  for(let i=0;i<=n;i++){
    const ang=i/n*6.2832;
    const wob=1+0.22*Math.sin(ang*3+seed)+0.12*Math.sin(ang*7+seed*2);
    const rad=r*wob*(0.94+rr()*0.12);
    const x=W/2+Math.cos(ang)*rad*1.2, y=H/2+Math.sin(ang)*rad;
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  }
  ctx.closePath();
  const g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,r*1.1);
  g.addColorStop(0,'rgba(24,28,31,.98)');
  g.addColorStop(.75,'rgba(34,39,42,.96)');
  g.addColorStop(1,'rgba(44,50,52,.9)');
  ctx.fillStyle=g; ctx.fill();
  // 边缘墨点
  if(p<0.6){
    for(let i=0;i<26;i++){
      const ang=rr()*6.2832, rad=r*(0.95+rr()*0.2);
      ctx.fillStyle=`rgba(30,34,37,${0.5*rr()})`;
      ctx.beginPath(); ctx.arc(W/2+Math.cos(ang)*rad*1.2,H/2+Math.sin(ang)*rad,3+rr()*14,0,6.2832); ctx.fill();
    }
  }
  ctx.restore();
}

/* ---------------- 暗角 + 纸纹 ---------------- */
let GRAIN_PAT=null;
function drawFinish(ctx){
  // 暗角
  const g=ctx.createRadialGradient(W/2,H*0.48,H*0.35,W/2,H*0.5,H*1.05);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(40,34,24,.20)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // 颗粒
  if(GRAIN_PAT){
    ctx.save(); ctx.globalAlpha=.5;
    ctx.translate(-(Math.random()*512|0),-(Math.random()*512|0));
    ctx.fillStyle=GRAIN_PAT; ctx.fillRect(0,0,W+512,H+512);
    ctx.restore();
  }
}

});

/* ---- 渲染 ---- */
let prevT=null;
function render(t){
  const idx=shotIndex(t);
  const jump=prevT===null?0:t-prevT;
  if(idx!==lastShot){ lastShot=idx; if(idx>0&&jump>0&&jump<1.2) wipeT=t; }
  prevT=t;
  const sh=SHOTS[idx];
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();
  sh.draw(ctx,t,t-sh.t0,sh.t1-sh.t0);
  ctx.restore();
  drawChapterCard(ctx,t);
  drawSub(ctx,t);
  drawFinish(ctx);
  drawWipe(ctx,t);
}

/* ---- 状态 ---- */
let filmT=0, playing=false, dirty=true, lastFrame=0;
let SEEK_LOCK=0;

/* ---- 声音：程序化古乐（五声音阶拨弦 + 箫 + 低音） ---- */
const Sound={
  ac:null,master:null,on:true,timer:null,next:0,step:0,started:false,
  scale:[293.66,329.63,392.0,440.0,523.25,587.33,659.25],
  init(){
    if(this.ac)return;
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    this.ac=new AC();
    const ac=this.ac;
    this.master=ac.createGain(); this.master.gain.value=0.0001;
    const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2400; lp.Q.value=0.4;
    const comp=ac.createDynamicsCompressor();
    comp.threshold.value=-20; comp.knee.value=20; comp.ratio.value=3;
    this.master.connect(lp); lp.connect(comp); comp.connect(ac.destination);
    // 简易混响
    const dl=ac.createDelay(1.2); dl.delayTime.value=0.38;
    const fb=ac.createGain(); fb.gain.value=0.34;
    const wet=ac.createGain(); wet.gain.value=0.3;
    lp.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(comp);
    this.master.gain.setTargetAtTime(0.19,ac.currentTime+0.1,2.2);
    // 低音持续（琴底）
    [146.83,110.0].forEach((f,i)=>{
      const o=ac.createOscillator(); o.type='sine'; o.frequency.value=f;
      const g=ac.createGain(); g.gain.value=i?0.035:0.05;
      const lfo=ac.createOscillator(); lfo.frequency.value=0.07+i*0.03;
      const lg=ac.createGain(); lg.gain.value=i?0.012:0.02;
      lfo.connect(lg); lg.connect(g.gain); lfo.start();
      o.connect(g); g.connect(this.master); o.start();
    });
    this.next=ac.currentTime+0.5;
    this.timer=setInterval(()=>this.tick(),250);
    this.started=true;
  },
  pluck(freq,t0,vel){
    const ac=this.ac;
    const o1=ac.createOscillator(); o1.type='triangle'; o1.frequency.value=freq;
    const o2=ac.createOscillator(); o2.type='sine'; o2.frequency.value=freq*2.005;
    const g=ac.createGain(); const g2=ac.createGain(); g2.gain.value=0.22;
    const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(3200,t0);
    f.frequency.exponentialRampToValueAtTime(900,t0+1.6);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vel,t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+2.4);
    o1.connect(f); o2.connect(g2); g2.connect(f); f.connect(g); g.connect(this.master);
    o1.start(t0); o2.start(t0); o1.stop(t0+2.6); o2.stop(t0+2.6);
  },
  flute(freq,t0,dur){
    const ac=this.ac;
    const o=ac.createOscillator(); o.type='sine'; o.frequency.value=freq;
    const vib=ac.createOscillator(); vib.frequency.value=5.1;
    const vg=ac.createGain(); vg.gain.value=freq*0.006;
    vib.connect(vg); vg.connect(o.frequency);
    const g=ac.createGain();
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(0.055,t0+0.5);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1800;
    o.connect(f); f.connect(g); g.connect(this.master);
    o.start(t0); vib.start(t0); o.stop(t0+dur+0.1); vib.stop(t0+dur+0.1);
  },
  tick(){
    if(!this.ac||this.ac.state!=='running')return;
    const ac=this.ac;
    while(this.next<ac.currentTime+1.2){
      const s=this.step++;
      const bar=s%8;
      // 主旋律：随机游走
      const idx=Math.floor(Math.abs(Math.sin(s*12.9898)*43758.5453)%1*this.scale.length);
      const n=this.scale[idx%this.scale.length];
      if(bar!==3&&bar!==7) this.pluck(n,this.next,0.075+0.05*Math.random());
      if(bar===0) this.pluck(n/2,this.next,0.06);
      if(bar===4&&Math.random()>0.5) this.flute(this.scale[(idx+3)%this.scale.length]*2,this.next,1.6);
      if(bar===6) this.pluck(n*1.5,this.next+0.28,0.05);
      this.next+=0.62+Math.random()*0.16;
    }
  },
  pause(){ if(this.ac)this.ac.suspend(); },
  resume(){ if(this.ac)this.ac.resume(); },
  setOn(v){
    this.on=v;
    if(!this.ac)return;
    if(v){ this.ac.resume(); this.master.gain.setTargetAtTime(0.19,this.ac.currentTime,0.4); }
    else this.master.gain.setTargetAtTime(0.0001,this.ac.currentTime,0.3);
  },
  /* 配音时自动压低古乐 */
  duck(on){
    if(!this.ac)return;
    const base=this.on?0.19:0.0001;
    this.master.gain.setTargetAtTime(on?base*0.38:base,this.ac.currentTime,0.25);
  }
};

/* =========================================================================
   配音（普通话）
   ① 默认：调用系统/浏览器中文语音合成，按字幕时间轴逐句播报，语速自动适配句长
   ② 可选：?voice=1 时优先读取同目录 voice/01.mp3 …（AI 配音或真人录音），
      文件缺失会自动回退到语音合成
   ========================================================================= */
const Narr={
  supported:(typeof speechSynthesis!=='undefined')&&(typeof SpeechSynthesisUtterance!=='undefined'),
  on:true, voices:[], vi:0, voice:null, idx:-1,
  fileMode:false, fileOK:true, audio:null, rateScale:1,
  init(){
    if(this.supported){
      this.pick();
      const ss=window.speechSynthesis;
      if(ss.addEventListener) ss.addEventListener('voiceschanged',()=>this.pick());
      else ss.onvoiceschanged=()=>this.pick();
    }
    this.updateBtn();
  },
  pick(){
    if(!this.supported)return;
    let all=[];
    try{ all=window.speechSynthesis.getVoices()||[]; }catch(e){}
    const zh=all.filter(v=>/^zh|chinese|中文|普通话|國語|国语|mandarin/i.test((v.lang||'')+' '+(v.name||'')));
    const pref=['xiaoxiao','xiaoyi','yunxi','yunjian','xiaohan','huihui','yaoyao','kangkang','ting-ting','tingting','meijia','google 普通话','sinji'];
    const rank=n=>{const l=n.toLowerCase();const i=pref.findIndex(x=>l.indexOf(x)>=0);return i<0?99:i;};
    zh.sort((a,b)=>rank(a.name)-rank(b.name));
    this.voices = zh.length?zh:all;
    if(this.voices.length){
      this.vi=Math.min(this.vi,this.voices.length-1);
      this.voice=this.voices[this.vi];
    }
    this.updateBtn();
  },
  updateBtn(){
    const b=document.getElementById('bVoice'), p=document.getElementById('bVoicePick');
    if(!b)return;
    if(!this.supported&&!this.fileMode){
      b.textContent='配音·不可用'; b.classList.remove('on'); b.title='当前浏览器不支持语音合成';
      if(p) p.textContent='音色';
      return;
    }
    b.textContent='配音'; b.classList.toggle('on',this.on);
    if(p){
      p.textContent = this.voices.length ? ('音色 '+(this.vi+1)+'/'+this.voices.length) : '音色';
      p.title = this.voice ? (this.voice.name+' · '+this.voice.lang) : '未检测到中文语音，将使用系统默认';
    }
  },
  warmup(){
    if(!this.supported)return;
    try{
      const u=new SpeechSynthesisUtterance(' ');
      u.volume=0.01; window.speechSynthesis.speak(u);
    }catch(e){}
  },
  stop(){
    if(this.audio){ try{ this.audio.pause(); this.audio.currentTime=0; }catch(e){} }
    if(this.supported){ try{ window.speechSynthesis.resume(); window.speechSynthesis.cancel(); }catch(e){} }
    Sound.duck(false);
  },
  reset(){ this.stop(); this.idx=-1; },
  pause(){
    if(this.audio){ try{ this.audio.pause(); }catch(e){} }
    if(this.supported){ try{ window.speechSynthesis.pause(); }catch(e){} }
    Sound.duck(false);
  },
  resume(){
    if(this.audio){ try{ this.audio.play(); }catch(e){} }
    if(this.supported){ try{ window.speechSynthesis.resume(); }catch(e){} }
  },
  cycleVoice(){
    if(!this.voices.length){ this.pick(); if(!this.voices.length)return; }
    this.vi=(this.vi+1)%this.voices.length;
    this.voice=this.voices[this.vi];
    this.updateBtn();
    this.idx=-1; this.stop();
    setTimeout(()=>this.say('文韵山河，洪州道韵。',2.2),80);
  },
  say(text,win){
    if(!this.on)return;
    this.stop();
    const plain=String(text).replace(/[“”]/g,'');
    const n=[...plain].length;
    let rate=clamp(n/(Math.max(1.8,win)*4.35),0.86,1.5)*this.rateScale;
    rate=clamp(rate,0.75,1.7);
    if(this.fileMode&&this.fileOK&&this.idx>=0){ this.playFile(this.idx,plain,win); return; }
    if(!this.supported)return;
    try{
      const u=new SpeechSynthesisUtterance(plain);
      if(this.voice) u.voice=this.voice;
      u.lang=(this.voice&&this.voice.lang)||'zh-CN';
      u.rate=rate; u.pitch=1.0; u.volume=1.0;
      u.onstart=()=>Sound.duck(true);
      u.onend=()=>Sound.duck(false);
      u.onerror=()=>Sound.duck(false);
      setTimeout(()=>{ try{ window.speechSynthesis.speak(u); }catch(e){} },70);
    }catch(e){}
  },
  playFile(i,text,win){
    try{
      if(this.audio){ this.audio.pause(); this.audio.currentTime=0; }
      const a=new Audio('voice/'+String(i+1).padStart(2,'0')+'.mp3');
      this.audio=a;
      a.onplaying=()=>Sound.duck(true);
      a.onended=()=>Sound.duck(false);
      const pr=a.play();
      if(pr&&pr.catch) pr.catch(()=>{ this.fileOK=false; this.say(text,win); });
    }catch(e){ this.fileOK=false; this.say(text,win); }
  },
  sync(t,playing){
    if(!this.on)return;
    if(!playing)return;
    const i=subIndexAt(t);
    if(i<0||i===this.idx)return;
    this.idx=i;
    this.say(SUBS[i][2],SUBS[i][1]-SUBS[i][0]);
  },
  setOn(v){
    this.on=v;
    if(!v){ this.idx=-1; this.stop(); }
    else this.idx=-1;
    this.updateBtn();
  }
};

/* ---- 时间格式 ---- */
function fmt(s){
  s=Math.max(0,Math.floor(s));
  const m=Math.floor(s/60), ss=s%60;
  return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0');
}

/* ---- UI ---- */
const elPlay=document.getElementById('bPlay');
const elDone=document.getElementById('done');
const elTc=document.getElementById('tc');
const elChap=document.getElementById('chapLabel');
const elIntro=document.getElementById('intro');
document.getElementById('marks').innerHTML=CHAPTERS.filter(c=>c.t0>0)
  .map(c=>`<div class="mark" style="left:${c.t0/DUR*100}%"><span>${c.label}</span></div>`).join('');

function updateUI(){
  elDone.style.width=(filmT/DUR*100).toFixed(2)+'%';
  elTc.textContent=fmt(filmT)+' / '+fmt(DUR);
  elPlay.textContent=playing?'❚❚ 暂停':'▶ 播放';
  let lab='片头';
  for(const c of CHAPTERS) if(filmT>=c.t0) lab=c.label;
  elChap.textContent=lab;
}

function play(){
  if(filmT>=DUR-0.05){ filmT=0; lastShot=-1; wipeT=-99; Narr.reset(); }
  playing=true; dirty=true; lastFrame=0;
  if(Sound.on){ try{ Sound.init(); Sound.resume(); }catch(e){} }
  Narr.warmup(); Narr.resume();
  stage.classList.add('ui');
  elIntro.classList.add('hide');
}
function pause(){ playing=false; Sound.pause(); Narr.pause(); dirty=true; }
function toggle(){ playing?pause():play(); }

elPlay.onclick=toggle;
document.getElementById('play').onclick=play;
document.getElementById('bBack').onclick=()=>{ filmT=0;lastShot=-1;wipeT=-99;Narr.reset();play(); };
document.getElementById('c1').onclick=()=>{ filmT=15;lastShot=-1;wipeT=14.5;Narr.reset();play(); };
document.getElementById('c2').onclick=()=>{ filmT=110;lastShot=-1;wipeT=109.5;Narr.reset();play(); };
document.getElementById('c3').onclick=()=>{ filmT=215;lastShot=-1;wipeT=214.5;Narr.reset();play(); };
document.getElementById('bVoice').onclick=()=>{ Narr.setOn(!Narr.on); };
document.getElementById('bVoicePick').onclick=()=>Narr.cycleVoice();
document.getElementById('bSub').onclick=e=>{
  SUB_ON=!SUB_ON; e.currentTarget.classList.toggle('on',SUB_ON); dirty=true;
};
document.getElementById('bSnd').onclick=e=>{
  const on=!Sound.on; Sound.setOn(on); e.currentTarget.classList.toggle('on',on);
  if(on){Sound.init();Sound.resume();}
  dirty=true;
};
document.getElementById('bFull').onclick=()=>{
  if(!document.fullscreenElement) stage.requestFullscreen&&stage.requestFullscreen();
  else document.exitFullscreen();
};
const track=document.getElementById('track');
track.onclick=e=>{
  const r=track.getBoundingClientRect();
  filmT=clamp((e.clientX-r.left)/r.width,0,0.9999)*DUR;
  lastShot=-1; wipeT=filmT-0.5; dirty=true; Narr.reset();
};
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();toggle();}
  else if(e.code==='ArrowRight'){filmT=clamp(filmT+5,0,DUR-0.1);lastShot=-1;dirty=true;Narr.reset();}
  else if(e.code==='ArrowLeft'){filmT=clamp(filmT-5,0,DUR-0.1);lastShot=-1;dirty=true;Narr.reset();}
  else if(e.key==='f'||e.key==='F'){document.getElementById('bFull').click();}
  else if(e.key==='s'||e.key==='S'){document.getElementById('bSub').click();}
  else if(e.key==='m'||e.key==='M'){document.getElementById('bSnd').click();}
});
let hideTimer=null;
stage.addEventListener('mousemove',()=>{
  stage.classList.add('ui');
  clearTimeout(hideTimer);
  hideTimer=setTimeout(()=>{ if(!document.fullscreenElement) stage.classList.remove('ui'); },2600);
});

/* ---- 主循环 ---- */
let slowCount=0;
function loop(now){
  if(!lastFrame)lastFrame=now;
  const rawDt=(now-lastFrame)/1000;
  const dt=Math.min(0.1,rawDt);
  lastFrame=now;
  if(playing){
    if(rawDt>0.09){ slowCount++; if(slowCount>24&&!LOWQ){LOWQ=true;} } else if(slowCount>0) slowCount--;
  }
  if(playing){
    filmT+=dt;
    if(filmT>=DUR){ filmT=DUR-0.001; playing=false; Sound.pause(); Narr.stop(); }
    dirty=true;
  }
  Narr.sync(filmT,playing);
  if(dirty){ render(filmT); updateUI(); dirty=false; }
  requestAnimationFrame(loop);
}

/* ---- 启动 ---- */
function boot(){
  PAPER=makePaper();
  GRAIN=makeGrain();
  GRAIN_PAT=ctx.createPattern(GRAIN,'repeat');
  const q=new URLSearchParams(location.search);
  if(q.has('t')) filmT=clamp(parseFloat(q.get('t'))||0,0,DUR-0.01);
  if(q.get('ui')==='0') document.body.classList.add('clean');
  if(q.get('nosound')==='1'){ Sound.on=false; document.getElementById('bSnd').classList.remove('on'); }
  Narr.fileMode=(q.get('voice')==='1');
  Narr.init();
  if(q.get('narr')==='0') Narr.setOn(false);
  const autoplay=q.get('play')==='1';
  if(q.has('t')||q.get('pause')==='1'){
    elIntro.classList.add('hide');
    stage.classList.add('ui');
    if(autoplay){playing=true;}
  }
  if(q.get('selftest')==='1'){
    const log=[];
    try{
      log.push('supported='+Narr.supported+' voices='+Narr.voices.length);
      if(Narr.supported&&window.speechSynthesis){
        const orig=window.speechSynthesis.speak.bind(window.speechSynthesis);
        window.speechSynthesis.speak=u=>{ log.push('SPEAK['+u.text.slice(0,10)+']rate='+u.rate.toFixed(2)); try{orig(u);}catch(e){log.push('speakErr');} };
      }
      Narr.idx=-1; Narr.sync(60,true);
      setTimeout(()=>{ Narr.idx=-1; Narr.sync(120,true); },260);
      setTimeout(()=>{ Narr.idx=-1; Narr.sync(250,true); },520);
    }catch(e){ log.push('ERR:'+e.message); }
    setTimeout(()=>{ document.title='TEST || '+log.join(' || '); },900);
  }
  if(q.has('debug')){
    setTimeout(()=>{document.title='VP '+innerWidth+'x'+innerHeight+' | canvasCss '+cv.clientWidth+'x'+cv.clientHeight+' | stage '+stage.clientWidth+'x'+stage.clientHeight;},300);
  }
  requestAnimationFrame(loop);
}
boot();

</script>
