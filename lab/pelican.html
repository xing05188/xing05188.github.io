<p class="tip">全部图形由 SVG 绘制，动画由 requestAnimationFrame 驱动（腿部为实时 IK 解算）· 点击画面可循环切换速度</p>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };

  var el = {
    rig:$("rig"), wheelR:$("wheelR"), wheelF:$("wheelF"),
    crankA:$("crankA"), crankB:$("crankB"), pedalA:$("pedalA"), pedalB:$("pedalB"),
    legA:$("legA"), legB:$("legB"), footA:$("footA"), footB:$("footB"),
    tail:$("tail"), wing:$("wingN"), head:$("head"), crest:$("crest"), fish:$("fishG"),
    hills:$("hills"), hills2:$("hills2"), bushes:$("bushes"), dash:$("dash"),
    chain1:$("chain1"), chain2:$("chain2"), sun:$("sunRays"), shadow:$("shadow"),
    cloud1:$("cloud1"), cloud2:$("cloud2"), cloud3:$("cloud3"),
    bird1:$("bird1"), bird2:$("bird2"), bw1:$("bw1"), bw2:$("bw2"),
    w1:$("w1"), w2:$("w2"), w3:$("w3"), w4:$("w4")
  };

  /* ---- 几何常量 ---- */
  var R = 52;            // 车轮半径
  var CR = 26;           // 曲柄长度
  var CX = 370, CY = 381;// 中轴
  var HX = 330, HY = 256;// 髋关节
  var L1 = 78, L2 = 80;  // 大腿 / 小腿

  /* ---- 状态 ---- */
  var dist = 0, t = 0, last = performance.now();
  var paused = false, target = 1, speed = 1;
  var STEPS = [0.45, 1, 1.9], stepIdx = 1;

  /* 两连杆 IK：返回膝盖坐标（膝盖朝前上方） */
  function knee(fx, fy){
    var dx = fx - HX, dy = fy - HY;
    var d = Math.sqrt(dx*dx + dy*dy) || 0.001;
    var dd = Math.min(d, L1 + L2 - 0.01);
    var a = (L1*L1 - L2*L2 + dd*dd) / (2*dd);
    var h = Math.sqrt(Math.max(0, L1*L1 - a*a));
    var ux = dx/d, uy = dy/d;
    var bx = HX + a*ux, by = HY + a*uy;
    return { x: bx + h*uy, y: by - h*ux };
  }
  function legPath(fx, fy){
    var k = knee(fx, fy);
    return "M" + HX + "," + HY + " L" + k.x.toFixed(1) + "," + k.y.toFixed(1) +
           " L" + fx.toFixed(1) + "," + fy.toFixed(1);
  }

  function frame(now){
    var dt = Math.min(0.05, (now - last)/1000);
    last = now;
    if(!paused){
      speed += (target - speed) * Math.min(1, dt*3);
      dist += 300 * speed * dt;
      t += dt;
    }

    var ang = dist / R;                 // 曲柄 / 车轮转角（弧度）
    var deg = ang * 180 / Math.PI;

    /* 车轮与曲柄 */
    el.wheelR.setAttribute("transform", "rotate(" + deg.toFixed(2) + ")");
    el.wheelF.setAttribute("transform", "rotate(" + deg.toFixed(2) + ")");
    el.crankA.setAttribute("transform", "rotate(" + deg.toFixed(2) + ")");
    el.crankB.setAttribute("transform", "rotate(" + (deg + 180).toFixed(2) + ")");

    /* 踏板与脚（相位差 180°） */
    var aA = ang, aB = ang + Math.PI;
    var fa = { x: CX + CR*Math.cos(aA), y: CY + CR*Math.sin(aA) };
    var fb = { x: CX + CR*Math.cos(aB), y: CY + CR*Math.sin(aB) };
    el.pedalA.setAttribute("transform", "translate(" + (CR*Math.cos(aA)).toFixed(1) + "," + (CR*Math.sin(aA)).toFixed(1) + ")");
    el.pedalB.setAttribute("transform", "translate(" + (CR*Math.cos(aB)).toFixed(1) + "," + (CR*Math.sin(aB)).toFixed(1) + ")");
    el.legA.setAttribute("d", legPath(fa.x, fa.y));
    el.legB.setAttribute("d", legPath(fb.x, fb.y));
    el.footA.setAttribute("transform", "translate(" + fa.x.toFixed(1) + "," + fa.y.toFixed(1) + ") rotate(" + (Math.sin(aA)*10).toFixed(1) + ")");
    el.footB.setAttribute("transform", "translate(" + fb.x.toFixed(1) + "," + fb.y.toFixed(1) + ") rotate(" + (Math.sin(aB)*10).toFixed(1) + ")");

    /* 颠簸与身体动态 */
    var bob = Math.sin(dist/26) * 1.8;
    el.rig.setAttribute("transform", "translate(0," + bob.toFixed(2) + ")");
    el.shadow.setAttribute("opacity", (0.16 - bob*0.012).toFixed(3));
    el.tail.setAttribute("transform", "rotate(" + (Math.sin(t*4)*2.2).toFixed(2) + ",256,244)");
    el.wing.setAttribute("transform", "rotate(" + (Math.sin(ang*2)*2.4).toFixed(2) + ",348,212)");
    el.head.setAttribute("transform", "translate(0," + (Math.sin(dist/26 - 0.7)*1.6).toFixed(2) + ")");
    el.crest.setAttribute("transform", "rotate(" + (-5 - speed*8 + Math.sin(t*7)*5).toFixed(2) + ",404,134)");
    el.fish.setAttribute("transform", "rotate(" + (Math.sin(t*6)*7).toFixed(2) + ",548,163)");

    /* 背景视差滚动 */
    el.hills.setAttribute("transform",  "translate(" + (-(dist*0.06) % 900).toFixed(1) + ",0)");
    el.hills2.setAttribute("transform", "translate(" + (-(dist*0.03) % 900).toFixed(1) + ",0)");
    el.bushes.setAttribute("transform", "translate(" + (-(dist*0.95) % 450).toFixed(1) + ",0)");
    el.dash.setAttribute("stroke-dashoffset", (-(dist % 86)).toFixed(1));
    el.chain1.setAttribute("stroke-dashoffset", (-(dist*0.5) % 7).toFixed(1));
    el.chain2.setAttribute("stroke-dashoffset", (-(dist*0.5) % 7).toFixed(1));
    el.sun.setAttribute("transform", "rotate(" + (t*6).toFixed(2) + ",762,92)");

    var clouds = [[el.cloud1, 140, 92, 1.0], [el.cloud2, 470, 56, 0.72], [el.cloud3, 730, 132, 0.5]];
    for(var i=0;i<clouds.length;i++){
      var c = clouds[i];
      var x = ((c[1] - dist*0.09*c[3]) % 1180 + 1180) % 1180 - 130;
      c[0].setAttribute("transform", "translate(" + x.toFixed(1) + "," + c[2] + ") scale(" + c[3] + ")");
    }

    /* 天上的小鸟 */
    var birds = [[el.bird1, el.bw1, 0], [el.bird2, el.bw2, 1]];
    for(var j=0;j<birds.length;j++){
      var b = birds[j], k = b[2];
      var bx = 830 - (((dist*0.05 + k*430) % 1150));
      var by = 108 + k*52 + Math.sin(t*0.9 + k*2)*10;
      b[0].setAttribute("transform", "translate(" + bx.toFixed(1) + "," + by.toFixed(1) + ") scale(" + (0.95 - k*0.28).toFixed(2) + ")");
      b[1].setAttribute("transform", "scale(1," + (1 + Math.sin(t*7 + k)*0.35).toFixed(3) + ")");
    }

    /* 速度线 */
    var winds = [el.w1, el.w2, el.w3, el.w4];
    var op = Math.max(0, Math.min(0.55, (speed - 0.85) * 0.75));
    for(var m=0;m<winds.length;m++){
      var wx = 320 - (((dist*1.8 + m*150) % 440));
      winds[m].setAttribute("transform", "translate(" + wx.toFixed(1) + ",0)");
      winds[m].setAttribute("opacity", op.toFixed(2));
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---- 交互 ---- */
  var btns = document.querySelectorAll("button[data-speed]");
  function setSpeed(v){
    target = v;
    stepIdx = STEPS.indexOf(v);
    for(var i=0;i<btns.length;i++){
      btns[i].classList.toggle("on", parseFloat(btns[i].dataset.speed) === v);
    }
  }
  for(var i=0;i<btns.length;i++){
    btns[i].addEventListener("click", function(){ setSpeed(parseFloat(this.dataset.speed)); });
  }
  var pauseBtn = $("pause");
  pauseBtn.addEventListener("click", function(){
    paused = !paused;
    pauseBtn.textContent = paused ? "▶ 继续" : "⏸ 暂停";
    pauseBtn.classList.toggle("on", paused);
  });
  $("scene").addEventListener("click", function(){
    stepIdx = (stepIdx + 1) % STEPS.length;
    setSpeed(STEPS[stepIdx]);
  });
})();
</script>
</body>
</html>
