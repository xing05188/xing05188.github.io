<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>林间小屋 · A Cabin in the Forest</title>
<style>
  :root {
    --ink: #f3ece1;
    --dim: rgba(243, 236, 225, 0.62);
    --glass: rgba(18, 20, 22, 0.42);
    --stroke: rgba(255, 255, 255, 0.14);
    --gold: #e8b877;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #0b0d0f; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  canvas { display: block; }

  /* ---------- 载入遮罩 ---------- */
  #loader {
    position: fixed; inset: 0; z-index: 40;
    background: radial-gradient(120% 90% at 50% 40%, #17191c 0%, #0a0b0d 70%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; transition: opacity 1.1s ease 0.15s, visibility 1.1s;
  }
  #loader.hidden { opacity: 0; visibility: hidden; }
  #loader .lt {
    font-family: Georgia, "Songti SC", "SimSun", serif;
    font-size: clamp(22px, 3.6vw, 40px); letter-spacing: 0.42em; text-indent: 0.42em;
    color: #efe6d8; opacity: 0.95;
  }
  #loader .ls { font-size: 12px; letter-spacing: 0.3em; color: var(--dim); }
  #bar { width: min(280px, 52vw); height: 2px; background: rgba(255,255,255,0.12); overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #8a6a4a, var(--gold)); transition: width .35s ease; }

  /* ---------- 标题 ---------- */
  #title {
    position: fixed; left: clamp(20px, 4vw, 54px); top: clamp(22px, 5vh, 52px); z-index: 20;
    pointer-events: none; opacity: 0; transform: translateY(14px);
    transition: opacity 1.6s ease .4s, transform 1.6s cubic-bezier(.2,.7,.2,1) .4s;
    text-shadow: 0 2px 18px rgba(0,0,0,.55);
  }
  #title.on { opacity: 1; transform: none; }
  #title h1 {
    margin: 0; font-family: Georgia, "Songti SC", "SimSun", serif; font-weight: 500;
    font-size: clamp(26px, 3.4vw, 44px); letter-spacing: 0.16em;
  }
  #title p { margin: 10px 0 0; font-size: 12px; letter-spacing: 0.34em; color: var(--dim); }

  /* ---------- 控制面板 ---------- */
  #panel {
    position: fixed; right: clamp(16px, 2.6vw, 34px); top: 50%; transform: translateY(-50%);
    z-index: 20; display: flex; flex-direction: column; gap: 10px; align-items: flex-end;
    opacity: 0; transition: opacity 1.2s ease .8s;
  }
  #panel.on { opacity: 1; }
  .group {
    background: var(--glass); border: 1px solid var(--stroke); border-radius: 14px;
    backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
    padding: 10px; display: flex; flex-direction: column; gap: 6px;
    box-shadow: 0 10px 40px rgba(0,0,0,.35);
  }
  .group .cap { font-size: 10px; letter-spacing: .26em; color: var(--dim); padding: 2px 6px 4px; }
  .row { display: flex; gap: 6px; }
  button {
    font: inherit; font-size: 12px; letter-spacing: .1em; color: var(--ink);
    background: rgba(255,255,255,.06); border: 1px solid transparent; border-radius: 9px;
    padding: 8px 12px; cursor: pointer; transition: all .22s ease; white-space: nowrap;
  }
  button:hover { background: rgba(255,255,255,.14); }
  button.active { background: rgba(232,184,119,.2); border-color: rgba(232,184,119,.5); color: #ffe6c2; }
  .toggles { flex-direction: column; }
  .toggles button { text-align: left; display: flex; justify-content: space-between; gap: 14px; }
  .toggles button span { opacity: .5; font-size: 10px; }
  .toggles button.active span { opacity: .95; color: var(--gold); }

  /* ---------- 底部提示 / 信息 ---------- */
  #hint {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 20;
    font-size: 11.5px; letter-spacing: .22em; color: rgba(243,236,225,.5);
    display: flex; gap: 18px; align-items: center; pointer-events: none;
    opacity: 0; transition: opacity 1.4s ease 1.4s; text-shadow: 0 1px 10px rgba(0,0,0,.6);
  }
  #hint.on { opacity: 1; }
  #hint b { font-weight: 400; color: rgba(243,236,225,.8); }
  #fps {
    position: fixed; left: clamp(20px, 4vw, 54px); bottom: 22px; z-index: 20;
    font-size: 10.5px; letter-spacing: .18em; color: rgba(243,236,225,.35);
    opacity: 0; transition: opacity 1.4s ease 1.4s;
  }
  #fps.on { opacity: 1; }

  /* ---------- 电影黑边（运镜时） ---------- */
  .bars { position: fixed; left: 0; right: 0; height: 0; background: #000; z-index: 15; transition: height .9s cubic-bezier(.2,.7,.2,1); pointer-events: none; }
  #barTop { top: 0; } #barBot { bottom: 0; }
  body.cine #barTop, body.cine #barBot { height: 6.2vh; }

  @media (max-width: 640px) {
    #panel { top: auto; bottom: 58px; transform: none; right: 12px; }
    .row { flex-wrap: wrap; justify-content: flex-end; }
    #hint { gap: 10px; font-size: 10px; letter-spacing: .12em; }
  }
</style>
</head>
<body>
  <div id="barTop" class="bars"></div>
  <div id="barBot" class="bars"></div>

  <div id="loader" class="hidden">
    <div class="lt">林 间 小 屋</div>
    <div class="ls">点亮黄昏…</div>
    <div id="bar"><i style="width: 100%;"></i></div>
  </div>

  <header id="title" class="on">
    <h1>林间小屋</h1>
    <p>A CABIN IN THE FOREST</p>
  </header>

  <div id="panel" class="on">
    <div class="group">
      <div class="cap">时 辰</div>
      <div class="row">
        <button data-time="dawn">清晨</button>
        <button data-time="noon">正午</button>
        <button data-time="golden" class="active">黄昏</button>
        <button data-time="night">夜</button>
      </div>
    </div>
    <div class="group toggles">
      <div class="cap">镜 头</div>
      <button id="btnOrbit" class="active">自动环绕 <span>ON</span></button>
      <button id="btnCine">电影运镜 <span>OFF</span></button>
    </div>
  </div>

  <div id="hint" class="on"><span><b>拖拽</b> 环视</span><span><b>滚轮</b> 远近</span><span><b>空格</b> 运镜</span></div>
  <div id="fps" class="on">21 FPS · 高画质</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =========================================================
   0. 基础工具
   ========================================================= */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const rnd = (a, b) => a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

const LOW = (navigator.hardwareConcurrency || 8) <= 4 || window.innerWidth < 700;
const CFG = {
  trees: LOW ? 150 : 260,
  grassBlades: LOW ? 1600 : 4200,
  bushes: LOW ? 26 : 46,
  flowers: LOW ? 40 : 90,
  stones: 54,
  leaves: LOW ? 70 : 150,
  motes: LOW ? 120 : 260,
  shadowMap: LOW ? 1024 : 2048,
};

/* ---------- 程序化纹理 ---------- */
function cv(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function toTex(canvas, rx = 1, ry = 1, srgb = true) {
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry);
  t.anisotropy = 8;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function noiseFill(ctx, w, h, amount, alpha) {
  const img = ctx.getImageData(0, 0, w, h), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * amount;
    d[i] = clamp(d[i] + n, 0, 255); d[i + 1] = clamp(d[i + 1] + n, 0, 255); d[i + 2] = clamp(d[i + 2] + n, 0, 255);
    if (alpha) d[i + 3] = clamp(d[i + 3], 0, 255);
  }
  ctx.putImageData(img, 0, 0);
}

/* 木板墙（横向板） */
function texWoodPlanks(vertical = false) {
  const S = 512, [c, x] = cv(S, S);
  x.fillStyle = '#6d4c31'; x.fillRect(0, 0, S, S);
  const rows = 8, rh = S / rows;
  for (let i = 0; i < rows; i++) {
    const v = rnd(-14, 14);
    x.fillStyle = `rgb(${109 + v},${76 + v * 0.85},${49 + v * 0.7})`;
    x.fillRect(0, i * rh, S, rh);
    // 木纹
    for (let g = 0; g < 16; g++) {
      x.strokeStyle = `rgba(${60 + rnd(-20, 20)},${40 + rnd(-15, 15)},${24 + rnd(-12, 12)},${rnd(0.12, 0.4)})`;
      x.lineWidth = rnd(0.6, 2.2); x.beginPath();
      const y0 = i * rh + rnd(2, rh - 2);
      x.moveTo(0, y0);
      for (let px = 0; px <= S; px += 32) x.lineTo(px, y0 + Math.sin(px * 0.02 + i) * rnd(1, 4));
      x.stroke();
    }
    // 节疤
    if (Math.random() < 0.55) {
      const kx = rnd(30, S - 30), ky = i * rh + rh * 0.5 + rnd(-6, 6);
      for (let r = 9; r > 0; r -= 2.2) {
        x.strokeStyle = `rgba(48,31,18,${0.14 + r * 0.03})`; x.lineWidth = 1.2;
        x.beginPath(); x.ellipse(kx, ky, r * rnd(1, 1.5), r * 0.6, rnd(0, 3), 0, Math.PI * 2); x.stroke();
      }
    }
    // 板缝
    x.fillStyle = 'rgba(28,18,10,0.75)'; x.fillRect(0, i * rh, S, 2.5);
    x.fillStyle = 'rgba(255,225,190,0.07)'; x.fillRect(0, i * rh + 2.5, S, 1.5);
  }
  noiseFill(x, S, S, 26);
  const t = toTex(c, 1, 1);
  if (vertical) { t.rotation = Math.PI / 2; t.center.set(0.5, 0.5); }
  return t;
}

/* 屋顶瓦片 */
function texRoof() {
  const S = 512, [c, x] = cv(S, S);
  x.fillStyle = '#5c3a2b'; x.fillRect(0, 0, S, S);
  const rows = 14, rh = S / rows;
  for (let r = 0; r < rows; r++) {
    const cols = 12, cwd = S / cols, off = (r % 2) * cwd * 0.5;
    for (let i = -1; i < cols + 1; i++) {
      const px = i * cwd + off, py = r * rh, v = rnd(-18, 18);
      x.fillStyle = `rgb(${92 + v},${58 + v * 0.8},${43 + v * 0.7})`;
      x.beginPath();
      x.moveTo(px + 1, py + rh);
      x.lineTo(px + 1, py + rh * 0.42);
      x.quadraticCurveTo(px + cwd * 0.5, py - rh * 0.08, px + cwd - 1, py + rh * 0.42);
      x.lineTo(px + cwd - 1, py + rh);
      x.closePath(); x.fill();
      x.strokeStyle = 'rgba(30,18,12,0.55)'; x.lineWidth = 1.4; x.stroke();
      x.fillStyle = 'rgba(255,220,190,0.06)';
      x.beginPath(); x.ellipse(px + cwd * 0.5, py + rh * 0.55, cwd * 0.3, rh * 0.16, 0, 0, Math.PI * 2); x.fill();
    }
  }
  // 零星苔痕
  for (let i = 0; i < 90; i++) {
    x.fillStyle = `rgba(${rnd(60, 92)},${rnd(84, 118)},${rnd(48, 70)},${rnd(0.08, 0.28)})`;
    x.beginPath(); x.ellipse(rnd(0, S), rnd(0, S), rnd(4, 20), rnd(3, 10), rnd(0, 3), 0, Math.PI * 2); x.fill();
  }
  noiseFill(x, S, S, 22);
  return toTex(c, 1, 1);
}

/* 石砌（地基 / 烟囱） */
function texStone() {
  const S = 512, [c, x] = cv(S, S);
  x.fillStyle = '#4a4741'; x.fillRect(0, 0, S, S);
  const rows = 7, rh = S / rows;
  for (let r = 0; r < rows; r++) {
    let px = -rnd(0, 60);
    while (px < S) {
      const w = rnd(50, 120);
      const v = rnd(-22, 22);
      x.fillStyle = `rgb(${74 + v},${71 + v},${65 + v})`;
      x.beginPath();
      x.moveTo(px + 3, r * rh + 3);
      x.lineTo(px + w - 3 + rnd(-4, 4), r * rh + 2);
      x.lineTo(px + w - 2 + rnd(-4, 4), r * rh + rh - 4);
      x.lineTo(px + 2, r * rh + rh - 3 + rnd(-3, 3));
      x.closePath(); x.fill();
      x.strokeStyle = 'rgba(24,24,20,0.5)'; x.lineWidth = 2; x.stroke();
      x.fillStyle = `rgba(255,250,240,${rnd(0.03, 0.1)})`;
      x.beginPath(); x.ellipse(px + w * 0.4, r * rh + rh * 0.32, w * 0.24, rh * 0.14, 0, 0, Math.PI * 2); x.fill();
      px += w + rnd(4, 9);
    }
  }
  noiseFill(x, S, S, 30);
  return toTex(c, 1, 1);
}

/* 草地细节（灰度，作 map 与地表相乘） */
function texGround() {
  const S = 512, [c, x] = cv(S, S);
  x.fillStyle = '#9aa07a'; x.fillRect(0, 0, S, S);
  for (let i = 0; i < 5200; i++) {
    const g = rnd(-40, 40);
    x.fillStyle = `rgba(${120 + g},${132 + g},${86 + g},${rnd(0.08, 0.35)})`;
    x.fillRect(rnd(0, S), rnd(0, S), rnd(1, 3), rnd(2, 9));
  }
  for (let i = 0; i < 900; i++) { // 落叶/枯草点
    x.fillStyle = `rgba(${rnd(120, 175)},${rnd(80, 120)},${rnd(40, 70)},${rnd(0.1, 0.4)})`;
    x.beginPath(); x.ellipse(rnd(0, S), rnd(0, S), rnd(1, 4), rnd(1, 3), rnd(0, 3), 0, Math.PI * 2); x.fill();
  }
  noiseFill(x, S, S, 18);
  return toTex(c, 1, 1);
}

/* 圆形柔光 sprite */
function texGlow(inner = 'rgba(255,240,210,1)', outer = 'rgba(255,180,90,0)') {
  const S = 128, [c, x] = cv(S, S);
  const g = x.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  g.addColorStop(0, inner); g.addColorStop(0.25, 'rgba(255,220,170,0.55)'); g.addColorStop(1, outer);
  x.fillStyle = g; x.fillRect(0, 0, S, S);
  return toTex(c);
}
/* 烟雾 sprite */
function texSmoke() {
  const S = 128, [c, x] = cv(S, S);
  const g = x.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  g.addColorStop(0, 'rgba(228,228,228,0.85)');
  g.addColorStop(0.45, 'rgba(210,210,210,0.32)');
  g.addColorStop(1, 'rgba(200,200,200,0)');
  x.fillStyle = g; x.fillRect(0, 0, S, S);
  for (let i = 0; i < 22; i++) { // 絮状扰动
    x.globalCompositeOperation = 'destination-out';
    x.fillStyle = `rgba(0,0,0,${rnd(0.05, 0.16)})`;
    x.beginPath(); x.arc(rnd(0, S), rnd(0, S), rnd(4, 16), 0, Math.PI * 2); x.fill();
  }
  x.globalCompositeOperation = 'source-over';
  return toTex(c);
}
/* 叶片 sprite */
function texLeaf() {
  const S = 64, [c, x] = cv(S, S);
  x.translate(S / 2, S / 2); x.rotate(-0.5);
  const g = x.createLinearGradient(-14, -18, 14, 18);
  g.addColorStop(0, '#d98a3a'); g.addColorStop(0.6, '#c2662a'); g.addColorStop(1, '#8f4a22');
  x.fillStyle = g;
  x.beginPath();
  x.moveTo(-13, -14);
  x.quadraticCurveTo(2, -20, 14, -8);
  x.quadraticCurveTo(4, 14, -13, -14);
  x.fill();
  x.strokeStyle = 'rgba(90,44,18,0.55)'; x.lineWidth = 1.1;
  x.beginPath(); x.moveTo(-12, -13); x.quadraticCurveTo(0, -2, 13, -8); x.stroke();
  return toTex(c);
}
/* 云 sprite */
function texCloud() {
  const S = 256, [c, x] = cv(S, S);
  for (let i = 0; i < 26; i++) {
    const cx = rnd(S * 0.15, S * 0.85), cy = rnd(S * 0.3, S * 0.7), r = rnd(18, 62);
    const g = x.createRadialGradient(cx, cy, 0, cx, cy, r);
    const a = rnd(0.05, 0.16);
    g.addColorStop(0, `rgba(255,255,255,${a})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g; x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill();
  }
  // 边缘淡出
  x.globalCompositeOperation = 'destination-in';
  const m = x.createRadialGradient(S / 2, S / 2, S * 0.1, S / 2, S / 2, S * 0.5);
  m.addColorStop(0, 'rgba(0,0,0,1)'); m.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = m; x.fillRect(0, 0, S, S);
  return toTex(c);
}
/* 水面法线 */
function texWaterNormal() {
  const S = 256, [c, x] = cv(S, S);
  const img = x.createImageData(S, S), d = img.data;
  const h = (u, v) => Math.sin(u * 9.1) * 0.35 + Math.sin(v * 7.3 + 1.7) * 0.3 + Math.sin((u + v) * 13.7) * 0.16 + Math.sin((u - v) * 5.1) * 0.2;
  for (let j = 0; j < S; j++) for (let i = 0; i < S; i++) {
    const u = i / S * Math.PI * 2, v = j / S * Math.PI * 2, e = 0.02;
    const dx = (h(u + e, v) - h(u - e, v)) / (2 * e), dy = (h(u, v + e) - h(u, v - e)) / (2 * e);
    let nx = -dx, ny = -dy, nz = 2.2;
    const l = Math.hypot(nx, ny, nz); nx /= l; ny /= l; nz /= l;
    const k = (j * S + i) * 4;
    d[k] = (nx * 0.5 + 0.5) * 255; d[k + 1] = (ny * 0.5 + 0.5) * 255; d[k + 2] = (nz * 0.5 + 0.5) * 255; d[k + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  const t = toTex(c, 1, 1, false);
  return t;
}

const TEX = {
  wood: texWoodPlanks(),
  woodV: texWoodPlanks(true),
  roof: texRoof(),
  stone: texStone(),
  ground: texGround(),
  glow: texGlow(),
  smoke: texSmoke(),
  leaf: texLeaf(),
  cloud: texCloud(),
  waterN: texWaterNormal(),
};
TEX.ground.repeat.set(70, 70);

/* =========================================================
   1. 渲染器 / 场景 / 相机
   ========================================================= */
const renderer = new THREE.WebGLRenderer({ antialias: !LOW, powerPreference: 'high-performance', stencil: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xd8b594, 0.0135);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 3000);
camera.position.set(10.5, 7.6, 18.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.rotateSpeed = 0.55;
controls.zoomSpeed = 0.7;
controls.minDistance = 6;
controls.maxDistance = 62;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minPolarAngle = 0.28;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.16;
controls.update();

/* =========================================================
   2. 地形高度场（房屋平台 / 池塘 / 远处山丘）
   ========================================================= */
const POND = new THREE.Vector3(-15.5, 0, 13.5), POND_R = 5.4;

function terrainHeight(x, z) {
  let h = 0;
  h += Math.sin(x * 0.055) * Math.cos(z * 0.048) * 1.75;
  h += Math.sin(x * 0.13 + 1.7) * Math.cos(z * 0.11 + 0.6) * 0.85;
  h += Math.sin(x * 0.29 + 0.4) * Math.cos(z * 0.33) * 0.22;
  const d = Math.hypot(x, z);
  h += Math.max(0, d - 58) * 0.17;            // 远处山丘
  h -= smoothstep(46, 96, d) * 1.2;            // 边缘下沉（藏进雾里）
  h *= smoothstep(9.5, 26, d) * 0.94 + 0.06;   // 屋子周围压平
  // 池塘洼地
  const pd = Math.hypot(x - POND.x, z - POND.z);
  if (pd < POND_R + 3.2) h -= (1 - smoothstep(0, POND_R + 3.2, pd)) * 1.55;
  return h;
}

/* 小径中心线（门前 → 林间） */
const PATH = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0.4, 0, 7.2),
  new THREE.Vector3(-1.2, 0, 13),
  new THREE.Vector3(-4.6, 0, 20),
  new THREE.Vector3(-4.0, 0, 28),
  new THREE.Vector3(1.2, 0, 36),
  new THREE.Vector3(6.5, 0, 45),
  new THREE.Vector3(6.0, 0, 56),
]);
const PATH_PTS = PATH.getSpacedPoints(160);
function distToPath(x, z) {
  let m = 1e9;
  for (let i = 0; i < PATH_PTS.length; i += 2) {
    const p = PATH_PTS[i], dx = p.x - x, dz = p.z - z;
    const d2 = dx * dx + dz * dz;
    if (d2 < m) m = d2;
  }
  return Math.sqrt(m);
}

   3. 天空 / 光照
   ========================================================= */
/* 渐变天空穹顶：天顶色 → 地平线色 + 太阳/月亮盘与光晕（颜色完全可控） */
const SKY_GEO = new THREE.SphereGeometry(2000, 48, 24);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: {
    uZenith: { value: new THREE.Color(0x24486e) },
    uHorizon: { value: new THREE.Color(0xff9f52) },
    uSunColor: { value: new THREE.Color(0xffd9a0) },
    uSunDir: { value: new THREE.Vector3(0, 1, 0) },
    uHaze: { value: 1.0 },
    uDisc: { value: 1.0 },
  },
  vertexShader: `
    varying vec3 vDir;
    void main(){
      vDir = normalize( position );
      gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
    }`,
  fragmentShader: `
    varying vec3 vDir;
    uniform vec3 uZenith, uHorizon, uSunColor, uSunDir;
    uniform float uHaze, uDisc;
    void main(){
      vec3 d = normalize( vDir );
      float h = d.y;
      // 天顶 → 地平线（幂次让地平线色带更宽，接近真实大气）
      float t = pow( clamp( h, 0.0, 1.0 ), 0.42 );
      vec3 col = mix( uHorizon, uZenith, t );
      // 地平线以下收进雾带
      col = mix( col, uHorizon * 0.88, smoothstep( 0.02, -0.14, h ) );
      // 太阳 / 月亮
      float sd = max( dot( d, normalize( uSunDir ) ), 0.0 );
      col += uSunColor * pow( sd, 320.0 ) * 4.0 * uDisc;
      col += uSunColor * pow( sd, 14.0 ) * 0.28 * uHaze;
      col += uSunColor * pow( sd, 3.2 ) * 0.06 * uHaze;
      // 地平线辉光带
      col += uHorizon * 0.14 * ( 1.0 - smoothstep( 0.0, 0.30, abs( h ) ) );
      gl_FragColor = vec4( col, 1.0 );
    }`,
});
const sky = new THREE.Mesh(SKY_GEO, skyMat);

      posts.push({ p, r: new THREE.Euler(rnd(-0.09, 0.09), Math.atan2(tan.x, tan.z), rnd(-0.07, 0.07)), s: rnd(0.85, 1.15) });

function windify(mat, amp = 0.16, heightRef = 0.6, phaseScale = 1.0) {
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = uTime;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nuniform float uTime;')
      .replace('#include <begin_vertex>', `
        vec3 transformed = vec3( position );
        #ifdef USE_INSTANCING
          vec3 iPos = instanceMatrix[3].xyz;
        #else
          vec3 iPos = vec3( 0.0 );
        #endif
        float h01 = clamp( position.y / ${heightRef.toFixed(3)}, 0.0, 1.0 );
        float gust = sin( uTime * 0.31 + iPos.x * 0.021 ) * 0.5 + 0.5;
        float amp = ${amp.toFixed(4)} * ( 0.6 + gust * 0.85 );
        float bend = sin( uTime * ${(1.55 * phaseScale).toFixed(3)} + iPos.x * ${(0.27 * phaseScale).toFixed(3)} + iPos.z * ${(0.22 * phaseScale).toFixed(3)} ) * amp * h01 * h01;
        transformed.x += bend;
        transformed.z += bend * 0.5;
        vec3 transformedNormal_unused;
      `);
  };
  mat.customProgramCacheKey = () => 'wind' + amp + '_' + heightRef + '_' + phaseScale;
  return mat;
}
const uTime = { value: 0 };

function buildForest() {
  const trunkG = new THREE.CylinderGeometry(0.19, 0.30, 1, 6, 1, true);
  trunkG.translate(0, 0.5, 0);
  const trunkM = new THREE.MeshStandardMaterial({ color: 0x4e3826, roughness: 0.95, flatShading: true });

  const pineParts = [];
  for (let i = 0; i < 4; i++) {
    const r = 2.15 - i * 0.42, h = 2.0 - i * 0.24;
    const c = new THREE.ConeGeometry(r, h, 9, 1);
    c.translate(0, 3.55 - i * 1.06, 0);
    pineParts.push(c);
  }
  const pineG = mergeGeometries([...pineParts]);
  const pineM = windify(new THREE.MeshStandardMaterial({ color: 0x4a6b47, roughness: 0.92, flatShading: true }), 0.05, 6.0, 0.5);

  const broadParts = [];
  const spots = [[0, 4.6, 0, 1.55], [-0.85, 3.95, 0.5, 1.1], [0.9, 4.15, -0.55, 1.2], [0.15, 5.3, 0.35, 0.95]];
  for (const [x, y, z, r] of spots) {
    const g = new THREE.IcosahedronGeometry(r, 1);
    g.translate(x, y, z);
    broadParts.push(g);
  }
  const broadG = mergeGeometries(broadParts);
  const broadM = windify(new THREE.MeshStandardMaterial({ color: 0x6f8a45, roughness: 0.9, flatShading: true }), 0.06, 6.0, 0.6);

  const spotsList = [];
  let guard = 0;
  while (spotsList.length < CFG.trees && guard++ < CFG.trees * 60) {
    const a = Math.random() * Math.PI * 2;
    const r = 11.5 + Math.pow(Math.random(), 0.62) * 92;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (distToPath(x, z) < 2.9) continue;
    if (Math.hypot(x - POND.x, z - POND.z) < POND_R + 2.2) continue;
    if (Math.hypot(x, z) < 11.5) continue;
    spotsList.push({ x, z, y: terrainHeight(x, z) });
  }
  const N = spotsList.length;
  const trunks = new THREE.InstancedMesh(trunkG, trunkM, N);
  trunks.castShadow = true; trunks.receiveShadow = true; trunks.frustumCulled = false;
  const pines = [], broads = [];
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), sv = new THREE.Vector3();
  const col = new THREE.Color();
  spotsList.forEach((s, i) => {
    const isPine = Math.random() < 0.62;
    const dist = Math.hypot(s.x, s.z);
    const scale = (isPine ? rnd(0.85, 1.55) : rnd(0.8, 1.35)) * (1 + smoothstep(40, 95, dist) * 0.35);
    const h = isPine ? 1 : rnd(0.75, 1.0);
    e.set(rnd(-0.035, 0.035), rnd(0, 6.28), rnd(-0.035, 0.035));
    q.setFromEuler(e);
    const trunkH = (isPine ? 3.7 : 3.2) * h;
    trunks.setMatrixAt(i, m.compose(
      new THREE.Vector3(s.x, s.y - 0.15, s.z), q,
      sv.set(scale * rnd(0.85, 1.15), trunkH * scale, scale * rnd(0.85, 1.15))));
    trunks.setColorAt(i, col.setHSL(0.08, 0.22, rnd(0.13, 0.2)));
    (isPine ? pines : broads).push({ ...s, scale, q: q.clone() });
  });
  trunks.instanceMatrix.needsUpdate = true;
  scene.add(trunks);

  function placeInst(geo, mat, list, baseY, tint) {
    const im = new THREE.InstancedMesh(geo, mat, list.length);
    im.castShadow = true; im.receiveShadow = true; im.frustumCulled = false;
    list.forEach((o, i) => {
      im.setMatrixAt(i, m.compose(new THREE.Vector3(o.x, o.y - 0.2 + baseY, o.z), o.q, sv.set(o.scale, o.scale, o.scale)));
      const autumn = Math.random();
      const hue = autumn < 0.3 ? rnd(0.09, 0.135) : (autumn < 0.55 ? rnd(0.05, 0.09) : rnd(0.22, 0.28));
      im.setColorAt(i, col.setHSL(hue, rnd(0.28, 0.5), tint * rnd(0.82, 1.18)));
    });
    im.instanceMatrix.needsUpdate = true;
    scene.add(im);
    return im;
  }
  placeInst(pineG, pineM, pines, 0, 0.30);
  placeInst(broadG, broadM, broads, 0, 0.40);

  // 灌木
  const bushG = new THREE.IcosahedronGeometry(0.7, 0);
  const bushM = windify(new THREE.MeshStandardMaterial({ color: 0x546b3c, roughness: 0.95, flatShading: true }), 0.09, 1.0, 1.4);
  const bushes = new THREE.InstancedMesh(bushG, bushM, CFG.bushes);
  bushes.castShadow = true; bushes.receiveShadow = true;
  for (let i = 0; i < CFG.bushes; i++) {
    let x, z, g = 0;
    do { const a = Math.random() * 6.28, r = rnd(7, 55); x = Math.cos(a) * r; z = Math.sin(a) * r; }
    while ((Math.hypot(x - POND.x, z - POND.z) < POND_R + 1 || distToPath(x, z) < 1.6) && g++ < 20);
    const s = rnd(0.55, 1.5);
    e.set(rnd(-0.2, 0.2), rnd(0, 6.28), rnd(-0.2, 0.2));
    bushes.setMatrixAt(i, m.compose(new THREE.Vector3(x, terrainHeight(x, z) + s * 0.28, z), q.setFromEuler(e), sv.set(s, s * rnd(0.6, 0.9), s)));
    bushes.setColorAt(i, col.setHSL(rnd(0.16, 0.28), rnd(0.25, 0.45), rnd(0.2, 0.36)));
  }
  bushes.instanceMatrix.needsUpdate = true; scene.add(bushes);

  // 石头 / 倒木
  const rockG = new THREE.DodecahedronGeometry(0.5, 0);
  const rockM = new THREE.MeshStandardMaterial({ color: 0x8d8779, roughness: 0.95, flatShading: true });
  const rocks = new THREE.InstancedMesh(rockG, rockM, CFG.stones);
  rocks.castShadow = true; rocks.receiveShadow = true;
  for (let i = 0; i < CFG.stones; i++) {
    const a = Math.random() * 6.28, r = rnd(6, 70);
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    const s = rnd(0.2, 1.15);
    e.set(rnd(0, 3), rnd(0, 6.28), rnd(0, 3));
    rocks.setMatrixAt(i, m.compose(new THREE.Vector3(x, terrainHeight(x, z) + s * 0.24, z), q.setFromEuler(e), sv.set(s, s * rnd(0.5, 0.85), s)));
    rocks.setColorAt(i, col.setHSL(0.1, 0.05, rnd(0.3, 0.5)));
  }
  rocks.instanceMatrix.needsUpdate = true; scene.add(rocks);

  // 倒木
  for (let i = 0; i < 5; i++) {
    const a = Math.random() * 6.28, r = rnd(14, 60);
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    const log = new THREE.Mesh(new THREE.CylinderGeometry(rnd(0.3, 0.5), rnd(0.3, 0.5), rnd(4, 8), 8),
      new THREE.MeshStandardMaterial({ color: 0x5a432f, roughness: 0.96, flatShading: true }));
    log.position.set(x, terrainHeight(x, z) + 0.4, z);
    log.rotation.set(Math.PI / 2 + rnd(-0.1, 0.1), rnd(0, 6.28), rnd(-0.2, 0.2));
    log.castShadow = true; log.receiveShadow = true; scene.add(log);
  }
}

function buildGrass() {
  const H = 0.62, W = 0.05;
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array([
    -W, 0, 0, W, 0, 0, W * 0.42, H * 0.55, 0.03, 0, H, 0.07,
  ]);
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(new Float32Array([
    0.18, 0.24, 0.10, 0.18, 0.24, 0.10, 0.35, 0.44, 0.18, 0.52, 0.60, 0.26,
  ]), 3));
  g.setIndex([0, 1, 2, 0, 2, 3]);
  g.computeVertexNormals();

  const mat = windify(new THREE.MeshStandardMaterial({
    vertexColors: true, roughness: 0.9, side: THREE.DoubleSide,
  }), 0.17, H, 1.0);

  const im = new THREE.InstancedMesh(g, mat, CFG.grassBlades);
  im.receiveShadow = true; im.castShadow = false; im.frustumCulled = false;
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), sv = new THREE.Vector3(), p = new THREE.Vector3();
  const col = new THREE.Color();
  let i = 0, guard = 0;
  while (i < CFG.grassBlades && guard++ < CFG.grassBlades * 8) {
    const a = Math.random() * 6.28, r = 2.5 + Math.pow(Math.random(), 0.55) * 62;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    const pd = Math.hypot(x - POND.x, z - POND.z);
    if (pd < POND_R - 0.4) continue;
    if (distToPath(x, z) < 0.9) continue;
    p.set(x, terrainHeight(x, z) - 0.03, z);
    e.set(rnd(-0.16, 0.16), rnd(0, 6.28), rnd(-0.16, 0.16));
    const s = rnd(0.7, 1.45) * (1 + smoothstep(30, 70, r) * 0.3);
    im.setMatrixAt(i, m.compose(p, q.setFromEuler(e), sv.set(rnd(0.8, 1.3), s, 1)));
    const autumn = Math.random();
    im.setColorAt(i, col.setHSL(autumn < 0.22 ? rnd(0.09, 0.13) : rnd(0.19, 0.29), rnd(0.3, 0.55), rnd(0.55, 0.95)));
    i++;
  }
  im.count = i;
  im.instanceMatrix.needsUpdate = true;
  scene.add(im);

  // 野花
  const fg = new THREE.SphereGeometry(0.07, 6, 5);
  const fm = new THREE.MeshStandardMaterial({ roughness: 0.8, flatShading: true });
  const flowers = new THREE.InstancedMesh(fg, fm, CFG.flowers);
  const fcol = [0xd8563f, 0xe8b23c, 0xc05f8a, 0xf0ece0, 0x8f6bd0];
  let j = 0, gj = 0;
  while (j < CFG.flowers && gj++ < CFG.flowers * 8) {
    const a = Math.random() * 6.28, r = rnd(5, 40);
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (Math.hypot(x - POND.x, z - POND.z) < POND_R) continue;
    if (distToPath(x, z) < 0.7) continue;
    p.set(x, terrainHeight(x, z) + rnd(0.18, 0.34), z);
    e.set(0, rnd(0, 6.28), 0);
    const s = rnd(0.7, 1.5);
    flowers.setMatrixAt(j, m.compose(p, q.setFromEuler(e), sv.set(s, s, s)));
    flowers.setColorAt(j, col.set(pick(fcol)));
    j++;
  }
  flowers.count = j;
  flowers.instanceMatrix.needsUpdate = true; scene.add(flowers);
  return im;
}

const cSun = new THREE.Color(), cFog = new THREE.Color(), cHemiS = new THREE.Color(), cHemiG = new THREE.Color();
const cZen = new THREE.Color(), cHor = new THREE.Color();

function sunDir(elevDeg, azimDeg) {
  const el = THREE.MathUtils.degToRad(elevDeg), az = THREE.MathUtils.degToRad(azimDeg);
  return new THREE.Vector3(Math.cos(el) * Math.cos(az), Math.sin(el), Math.cos(el) * Math.sin(az));
}
function applyLighting(t) {
  // 夜间改用月亮方向（避免光源跑到地平线以下）
  const night = t.elev < 0;
  const d = night ? sunDir(-t.elev + 26, t.azim + 165) : sunDir(t.elev, t.azim);
  skyMat.uniforms.uZenith.value.set(t.zenith);
  skyMat.uniforms.uHorizon.value.set(t.horizon);
  skyMat.uniforms.uSunColor.value.set(t.sunColor);
  skyMat.uniforms.uSunDir.value.copy(d);
  skyMat.uniforms.uHaze.value = t.haze;
  skyMat.uniforms.uDisc.value = t.disc;
  // 地面雾
  const gf = clamp((t.fogD - 0.007) * 20, 0, 0.3);
  groundFog.forEach(f => { f.mesh.material.opacity = gf; f.mesh.material.color.set(t.fog); });
  sunLight.position.copy(d).multiplyScalar(90);
  sunLight.color.set(t.sunColor);
  sunLight.intensity = t.sunInt;
  hemi.color.set(t.hemiSky); hemi.groundColor.set(t.hemiGnd); hemi.intensity = t.hemiInt;
  bounce.intensity = t.fill;
  scene.fog.color.set(t.fog); scene.fog.density = t.fogD;
  renderer.toneMappingExposure = t.exposure;
  lanternLight.intensity = t.lamp;
  lanternMesh.material.emissiveIntensity = 0.25 + t.lamp * 0.9;
  roomLight.intensity = t.room;
  fireLight.intensity = t.fire * (0.85 + Math.sin(uTime.value * 7.3) * 0.08 + Math.sin(uTime.value * 3.1) * 0.07);
  glassMat.emissiveIntensity = 0.15 + t.room * 0.6;
  windowGlows.forEach(g => {
    g.material.opacity = 0.06 + t.room * 0.3;
    const s = g.userData.s * (1 + t.room * 0.12);
    g.scale.set(s, s, 1);
  });
  bloomPass.strength = t.bloom;
  starMat.uniforms.uOpacity.value = t.stars;
  const motes = particles.find(p => p.kind === 'motes');
  motes.mat.uniforms.uOpacity.value = 0.12 + t.motes * 0.4;
  motes.mat.uniforms.uBlink.value = t.blink;
  motes.mat.uniforms.uColor.value.set(t.blink > 0.5 ? 0xd9ff8f : 0xffe6b0);
  const smoke = particles.find(p => p.kind === 'smoke');
  smoke.mat.uniforms.uOpacity.value = t.smoke;
  const leaf = particles.find(p => p.kind === 'leaf');
  leaf.mat.uniforms.uTint.value.set(t.elev > 20 ? 0xffe9c4 : (t.elev > 0 ? 0xffd0a0 : 0x9fb0c8));
  cinPass.uniforms.uWarm.value = t.warm;
  cinPass.uniforms.uGrain.value = 0.028 + (1 - t.elev / 60) * 0.012;
  // 云被阳光染色
  const cc = new THREE.Color().set(t.elev > 12 ? 0xffffff : (t.elev > 0 ? 0xffd0a8 : 0x6b7590));
  clouds.forEach(c => { c.mesh.material.color = cc; c.mesh.material.opacity = t.elev < 0 ? 0.28 : 0.5; });
}
function setTime(key) {
  currentKey = key;
  target = { ...TIMES[key] };
  from = { ...cur };
  tweenT = 0;
  document.querySelectorAll('[data-time]').forEach(b => b.classList.toggle('active', b.dataset.time === key));
}
function stepTween(dt) {
  if (tweenT >= 1) { applyLighting(cur); return; }
  tweenT = Math.min(1, tweenT + dt / 2.6);
  const e = tweenT < 0.5 ? 2 * tweenT * tweenT : 1 - Math.pow(-2 * tweenT + 2, 2) / 2;
  for (const k in cur) {
    if (k === 'sunColor' || k === 'fog' || k === 'hemiSky' || k === 'hemiGnd' || k === 'zenith' || k === 'horizon') continue;
    cur[k] = lerp(from[k], target[k], e);
  }
  cSun.set(from.sunColor).lerp(new THREE.Color(target.sunColor), e);
  cFog.set(from.fog).lerp(new THREE.Color(target.fog), e);
  cHemiS.set(from.hemiSky).lerp(new THREE.Color(target.hemiSky), e);
  cHemiG.set(from.hemiGnd).lerp(new THREE.Color(target.hemiGnd), e);
  cZen.set(from.zenith).lerp(new THREE.Color(target.zenith), e);
  cHor.set(from.horizon).lerp(new THREE.Color(target.horizon), e);
  applyLighting({
    ...cur,
    sunColor: cSun.getHex(), fog: cFog.getHex(), hemiSky: cHemiS.getHex(), hemiGnd: cHemiG.getHex(),
    zenith: cZen.getHex(), horizon: cHor.getHex(),
  });
  if (tweenT >= 1) { for (const k in cur) cur[k] = target[k]; scheduleEnv(true); }
}

const CinematicShader = {
  uniforms: {
    tDiffuse: { value: null }, uTime: { value: 0 }, uResolution: { value: new THREE.Vector2(innerWidth, innerHeight) },
    uVignette: { value: 0.88 }, uGrain: { value: 0.03 }, uSaturation: { value: 1.4 },
    uContrast: { value: 1.1 }, uAberration: { value: 0.0032 }, uWarm: { value: 1.0 },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 ); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uTime, uVignette, uGrain, uSaturation, uContrast, uAberration, uWarm;
    uniform vec2 uResolution;
    varying vec2 vUv;
    void main(){
      vec2 c = vUv - 0.5;
      float r2 = dot( c, c );
      float ab = uAberration * ( 0.35 + r2 * 3.0 );
      vec3 col;
      col.r = texture2D( tDiffuse, vUv + c * ab ).r;
      col.g = texture2D( tDiffuse, vUv ).g;
      col.b = texture2D( tDiffuse, vUv - c * ab ).b;

      float l = dot( col, vec3( 0.2126, 0.7152, 0.0722 ) );
      col = mix( vec3( l ), col, uSaturation );            // 饱和
      col = ( col - 0.5 ) * uContrast + 0.5;               // 对比
      col = col / ( 1.0 + max( col - vec3( 0.78 ), vec3( 0.0 ) ) * 1.7 ); // 高光胶片式柔压
      // 青–橙分离调色：暗部推向青蓝，亮部推向暖橙
      col += vec3( -0.014, 0.004, 0.034 ) * uWarm * ( 1.0 - l ) * ( 1.0 - l );
      col += vec3( 0.030, 0.011, -0.016 ) * uWarm * l;

      float v = smoothstep( 1.18, 0.20, length( c ) * uVignette );
      col *= mix( 1.0, v, 0.5 );

      float n = fract( sin( dot( vUv * uResolution + uTime * 91.7, vec2( 12.9898, 78.233 ) ) ) * 43758.5453 );
      col += ( n - 0.5 ) * uGrain;

      gl_FragColor = vec4( clamp( col, 0.0, 1.0 ), 1.0 );
    }`,
};

  if (e.key === '1') setTime('dawn');
  if (e.key === '2') setTime('noon');
  if (e.key === '3') setTime('golden');
  if (e.key === '4') setTime('night');
});
controls.addEventListener('start', () => {
  if (controls.autoRotate) { controls.autoRotate = false; btnOrbit.classList.remove('active'); btnOrbit.querySelector('span').textContent = 'OFF'; }
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloomPass.setSize(innerWidth, innerHeight);
  cinPass.uniforms.uResolution.value.set(innerWidth, innerHeight);
});

/* =========================================================
   14. 主循环
   ========================================================= */
const clock = new THREE.Clock();
let fpsAcc = 0, fpsN = 0, fpsEl = document.getElementById('fps');
let envTimer = 0, envDirty = true;
function scheduleEnv(now) { if (now) envTimer = 0.001; else envDirty = true; }

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  uTime.value = t;
  cinPass.uniforms.uTime.value = t;

  stepTween(dt);
  envTimer -= dt;
  if (envTimer <= 0 && envDirty) { updateEnvMap(); envDirty = false; envTimer = 1.2; }

  if (cine) {
    cineT = (cineT + dt / 78) % 1;
    const p = camPath.getPointAt(cineT);
    camera.position.lerp(p, 1 - Math.pow(0.0015, dt));
    const tg = camTargetPath.getPointAt(cineT);
    camera.lookAt(tg);
  } else {
    controls.update();
  }

  clouds.forEach(c => {
    c.mesh.position.x = c.base.x + Math.sin(t * 0.012 * c.sp + c.sp) * 90 + t * c.sp * 0.35 % 400 - 200;
    c.mesh.position.z = c.base.z + Math.cos(t * 0.009 * c.sp) * 26;
  });
  groundFog.forEach(f => {
    f.mesh.position.x = Math.sin(t * f.sp + f.ph) * 24;
    f.mesh.position.z = Math.cos(t * f.sp * 0.8 + f.ph) * 24;
  });

  composer.render();

  fpsAcc += dt; fpsN++;
  if (fpsAcc > 1) { fpsEl.textContent = Math.round(fpsN / fpsAcc) + ' FPS · ' + (LOW ? '轻量' : '高画质'); fpsAcc = 0; fpsN = 0; }
  requestAnimationFrame(tick);
}

/* 调试/自动化接口（固定机位截图、脚本控制时辰） */
window.__forest = {
  camera, controls, scene, renderer, setTime, toggleCine, TIMES,
  freeze(x, y, z, tx, ty, tz) {
    controls.autoRotate = false;
    // 临时关闭阻尼，强制球面 snap 到目标位置（避免阻尼在多帧内还在收敛）
    const wasDamping = controls.enableDamping;
    controls.enableDamping = false;
    camera.position.set(x, y, z);
    controls.target.set(tx, ty, tz);
    controls.update();
    controls.update();
    controls.enableDamping = wasDamping;
  },
};

/* =========================================================
   15. 启动
   ========================================================= */
const bar = document.querySelector('#bar i');
async function boot() {
  const frame = () => new Promise(r => requestAnimationFrame(r));
  const steps = [
    ['铺设地形…', () => {}],
    ['搭建木屋…', () => {}],
    ['种下森林…', () => {}],
    ['点亮黄昏…', () => {}],
  ];
  for (let i = 0; i < steps.length; i++) {
    document.querySelector('#loader .ls').textContent = steps[i][0];
    bar.style.width = ((i + 1) / steps.length * 100) + '%';
    await frame(); await frame();
  }
  // 预热一帧（让着色器按需编译），不强求全部 compile
  applyLighting(cur);
  updateEnvMap();
  envDirty = false; envTimer = 1.2;
  for (let i = 0; i < 3; i++) { composer.render(); await frame(); }
  document.getElementById('loader').classList.add('hidden');
  document.getElementById('title').classList.add('on');
  document.getElementById('panel').classList.add('on');
  document.getElementById('hint').classList.add('on');
  fpsEl.classList.add('on');
  tick();
}
boot();

window.addEventListener('error', (e) => {
  const l = document.getElementById('loader');
  if (l && !l.classList.contains('hidden')) {
    l.querySelector('.ls').textContent = '场景加载失败：' + (e.message || '未知错误');
  }
});
</script>
